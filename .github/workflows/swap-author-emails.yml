name: Swap old author emails (temporary)
# Temporary, run by hand once, then removed. Rewrites every branch so each
# commit's author and committer address is a GitHub no-reply one (any other
# address becomes Jxstrr0's no-reply address). The files in every commit stay
# exactly the same; only the commit IDs change. main goes first, then the
# other branches only if main was accepted.
on: workflow_dispatch
permissions:
  contents: write
jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - name: Rewrite and force-push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          git clone --quiet --bare "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" r
          cd r
          before=$(git rev-parse refs/heads/main)
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch -f --env-filter '
            NR=322161611+Jxstrr0@users.noreply.github.com
            case "$GIT_AUTHOR_EMAIL" in *@users.noreply.github.com|noreply@anthropic.com) ;; *) GIT_AUTHOR_EMAIL=$NR ;; esac
            case "$GIT_COMMITTER_EMAIL" in *@users.noreply.github.com|noreply@anthropic.com) ;; *) GIT_COMMITTER_EMAIL=$NR ;; esac
          ' -- --branches > /dev/null
          after=$(git rev-parse refs/heads/main)
          [ "$(git rev-parse "$before^{tree}")" = "$(git rev-parse "$after^{tree}")" ] || { echo "main's files changed, stopping"; exit 1; }
          left=$(git log --branches --format='%ae%n%ce' | grep -vc -e '@users.noreply.github.com$' -e '^noreply@anthropic.com$' || true)
          echo "Other addresses left after rewrite: $left"
          [ "$left" = "0" ] || exit 1
          git push --force origin refs/heads/main
          echo "main pushed"
          for b in $(git for-each-ref --format='%(refname:short)' refs/heads | grep -vx main); do
            git push --quiet --force origin "refs/heads/$b" && echo "pushed $b" || echo "REFUSED $b"
          done
