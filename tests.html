test('The weekend paper: a lead with a deck, the polls on the record, a quiet week still makes a page, every deck fills', () => {
  // A guided first week ends on a front page whose lead is filled in and whose polls have their first point.
  const s = newGame({ seed: 'TEST-1', party: 'p1', guided: true });
  const rng = createRng('front');
  for (let i = 0; i < 4000 && s.flow.pending?.kind !== 'weekSummary'; i++) botAct(s, rng);
  const sum = s.flow.pending?.summary;
  assert(sum, 'reached the first weekend');
  const lead = sum.press[0];
  assert(lead && lead.text && lead.paper && lead.event, 'the first week has a lead story');
  assert(!/[{}]/.test(lead.text + (lead.deck || '')), 'the lead is filled in: ' + lead.text);
  assert(sum.press.every((e, i) => i === 0 || media.FRONT_PRIORITY.indexOf(e.event) >= media.FRONT_PRIORITY.indexOf(sum.press[i - 1].event)), 'stories run in front-page order');
  assert(s.pollHistory.length === 1 && Object.keys(s.pollHistory[0].polling).join() === Object.keys(s.polling).join(), 'the polls go on the record at the weekend');
  assert(sum.polling && typeof sum.polling[s.house.government] === 'number', 'the summary carries the polls');
  // Weeks later the chart has a line to draw.
  for (let i = 0; i < 4000 && s.date.absWeek < 3; i++) botAct(s, rng);
  assert(s.pollHistory.length >= 2, 'poll history grows week by week: ' + s.pollHistory.length);
  // A week with no press at all still gets a lead, chosen without touching the RNG.
  const q = newGame({ seed: 'TEST-2', party: 'p2' });
  q.press = [];
  const before = JSON.stringify(q.rng);
  for (const fn of pacing.hooks.weekend) fn(q, createRng('unused'));
  const quiet = q.flow.week.press[0];
  assert(quiet?.quiet && quiet.text && quiet.deck && quiet.paper && !/[{}]/.test(quiet.text + quiet.deck), 'a quiet week has a filled lead');
  assert(JSON.stringify(q.rng) === before, 'the quiet lead does not draw on the RNG');
  // Every deck, byline and caption uses only the keys a headline can fill.
  const H = data().headlines;
  const keys = new Set(['name', 'riding', 'party', 'leader', 'paper', 'bill', 'yeas', 'nays', 'count', 'opposition', 'minister', 'issue', 'member', 'role']);
  let decks = 0;
  for (const [event, list] of Object.entries(H.decks)) {
    assert(H.headlines.some((h) => h.event === event), 'decks for a known event: ' + event);
    for (const d of list) {
      decks++;
      for (const k of d.match(/\{(\w+)\}/g) || []) assert(keys.has(k.slice(1, -1)), `deck key ${k} in: ${d}`);
    }
  }
  for (const c of [...H.bylines, ...H.captions]) for (const k of c.match(/\{(\w+)\}/g) || []) assert(['name', 'riding'].includes(k.slice(1, -1)), 'caption key ' + k);
  // The player's stories carry their photograph; the House's do not.
  const r2 = createRng('you');
  media.headline(s, r2, 'townHall', { bill: 'An Act' });
  media.headline(s, r2, 'billPassed', { bill: 'An Act', yeas: 60, nays: 50 });
  const [th, bp] = s.press.slice(-2);
  assert(th.you === true && bp.you === false, 'the photo flag follows the player');
  assert(th.deck && !/[{}]/.test(th.deck), 'a deck comes with the headline');
  return `${lead.paper}: ${lead.text} · ${decks} decks`;
});

section('Round two · Seasons');

test('The year runs September to June: forty weeks, ten months of four, four seasons on the tuned weeks', () => {
  const C = tuning().calendar;
  assert(C.months.length * C.weeksPerMonth === C.weeksPerYear, 'months do not fill the year');
  const at = (week, dayOfWeek = 1) => calendarOf({ week, year: 1, dayOfWeek });
  const checks = [[1, 'September', 1, 'autumn'], [12, 'November', 26, 'autumn', 5], [13, 'December', 1, 'winter'], [24, 'February', 26, 'winter', 5], [25, 'March', 1, 'spring'], [36, 'May', 22, 'spring'], [37, 'June', 1, 'summer'], [40, 'June', 26, 'summer', 5]];
  for (const [week, month, day, season, dow = 1] of checks) {
    const c = at(week, dow);
    assert(c.month === month && c.dayOfMonth === day && c.season === season, `week ${week} day ${dow}: ${c.dayOfMonth} ${c.month}, ${c.season}`);
  }
  // From an absolute week alone (the agenda's date), and the weekend paper's Saturday.
  const c = calendarOf({ absWeek: 53, dayOfWeek: 6 });
  assert(c.year === 2 && c.week === 14 && c.month === 'December' && c.dayOfMonth === 13, `absWeek 53 Saturday: ${c.dayOfMonth} ${c.month}, year ${c.year}`);
  return checks.map(([w]) => `${w}: ${at(w).dayOfMonth} ${at(w).month}`).join(' · ');
});

test('Weather is settled by the seed and the week, fits the season, and never touches the RNG', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p1' });
  const rngBefore = JSON.stringify(s.rng);
  const kinds = {};
  let snowWeeks = 0;
  let janTemp = 0;
  let juneTemp = 0;
  for (let w = 0; w < 160; w++) {
    const a = weatherOf(s, w);
    const b = weatherOf(s, w);
    assert(JSON.stringify(a) === JSON.stringify(b), `week ${w}: not deterministic`);
    assert(data().strings[`weather.${a.kind}`], `week ${w}: no name for ${a.kind}`);
    assert(a.temp > -30 && a.temp < 36, `week ${w}: ${a.temp}°`);
    if (a.season === 'summer') assert(a.kind !== 'snow' && a.kind !== 'storm' && a.snow === 0, `week ${w}: snow in June`);
    if (a.season === 'winter') assert(a.snow === 1 && a.kind !== 'rain', `week ${w}: ${a.kind}, cover ${a.snow} in winter`);
    if (a.kind === 'snow' || a.kind === 'storm') assert(a.snow > 0, `week ${w}: snow falling on bare ground`);
    if (a.falling === 'rain') assert(a.wet === 1, `week ${w}: rain but dry`);
    if (a.month === 'January') janTemp += a.temp;
    if (a.month === 'June') juneTemp += a.temp;
    if (a.snow > 0) snowWeeks++;
    kinds[a.kind] = (kinds[a.kind] || 0) + 1;
  }
  assert(juneTemp > janTemp, 'June is not warmer than January');
  assert(snowWeeks >= 48 && snowWeeks <= 80, `${snowWeeks} weeks with snow on the ground`);
  assert(Object.keys(kinds).length >= 5, `only ${Object.keys(kinds).join(', ')}`);
  const other = newGame({ seed: 'TEST-2', party: 'p1' });
  assert([0, 1, 2, 3, 4, 5].some((w) => weatherOf(other, w).kind !== weatherOf(s, w).kind), 'two seeds have the same weather');
  assert(JSON.stringify(s.rng) === rngBefore, 'the weather moved the RNG');
  return Object.entries(kinds).map(([k, n]) => `${k} ${n}`).join(', ') + ` · ${snowWeeks} snow weeks`;
});

test('The first Monday of winter logs the turn of the season once, and the first week of all logs none', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p1' });
  const turns = Object.values(data().seasons.turns).flat();
  const turned = () => s.log.filter((l) => turns.includes(l.text));
  const winterStart = tuning().calendar.seasons.winter;
  for (let i = 0; i < 2000 && s.date.week < winterStart + 1; i++) {
    const p = pacing.skip(s);
    if (p?.kind === 'dissolved') throw new Error('dissolved');
    pacing.resolve(s, p?.kind === 'division' ? 'line' : null);
  }
  assert(s.date.week >= winterStart + 1, `only reached week ${s.date.week}`);
  const lines = turned();
  assert(lines.length === 1 && data().seasons.turns.winter.includes(lines[0].text), `${lines.length} season lines: ${lines.map((l) => l.text).join(' | ')}`);
  assert(lines[0].week === winterStart - 1, `logged in week ${lines[0].week + 1}, not ${winterStart}`);
  return lines[0].text;
});

test('Election night is settled by the seed: the count ends on your margin, the House fills to its real seats, no line repeats', () => {
  let flips = 0;
  let closeSeats = 0;
  for (let k = 0; k < 24; k++) {
    const s = newGame({ seed: `NIGHT-${k}`, guided: true });
    const rngBefore = JSON.stringify(s.rng);
    const a = coldOpen.electionNight(s);
    const b = coldOpen.electionNight(s);
    assert(JSON.stringify(a) === JSON.stringify(b), `${k}: not deterministic`);
    assert(JSON.stringify(s.rng) === rngBefore, `${k}: the night moved the game's RNG`);
    const last = a.steps[a.steps.length - 1];
    assert(last.votes[0] === a.candidates[0].votes && last.leader === 0, `${k}: the count doesn't end on your total, or you lost`);
    assert(a.margin > 0 && a.margin === a.candidates[0].votes - Math.max(...a.candidates.slice(1).map((c) => c.votes)), `${k}: margin ${a.margin}`);
    const houses = {};
    for (const m of Object.values(s.mps)) houses[m.party] = (houses[m.party] || 0) + 1;
    assert(JSON.stringify(last.seats) === JSON.stringify(houses), `${k}: the seats don't end on the House`);
    for (let i = 1; i < a.steps.length; i++) assert(a.steps[i].polls >= a.steps[i - 1].polls, `${k}: polls went backwards`);
    const call = a.steps.findIndex((x) => x.called);
    assert(call > 0 && a.steps[call].line.includes(data().coldOpen.broadcaster), `${k}: the country is never called`);
    const lines = a.steps.map((x) => x.line);
    assert(new Set(lines).size === lines.length, `${k}: a line repeats`);
    assert(!lines.concat(a.declaration).some((l) => /\{\w+\}/.test(l)), `${k}: a placeholder is left`);
    if (a.close) {
      closeSeats++;
      assert(a.steps[0].leader !== 0, `${k}: a close seat opens with you ahead`);
      flips += a.steps.some((x, i) => i > 0 && x.leader === 0 && a.steps[i - 1].leader !== 0) ? 1 : 0;
    }
  }
  assert(closeSeats > 0 && flips === closeSeats, `${closeSeats} close seats, ${flips} turned`);
  return `${closeSeats} close seats of 24, every one turned`;
});

test('A new career opens on election night, walks into the chamber, then the first Monday; skipping goes straight to Monday', () => {
  const plain = newGame({ seed: 'TEST-1', guided: true });
  const s = newGame({ seed: 'TEST-1', guided: true, coldOpen: true });
  assert(plain.flow.pending?.kind !== 'coldOpen', 'a game without the cold open has one');
  assert(JSON.stringify(plain.rng) === JSON.stringify(s.rng), 'the cold open moved the RNG');
  assert(parliamentHash(plain) === parliamentHash(s), 'the cold open changed the Parliament');
  assert(s.flow.pending?.kind === 'coldOpen' && s.flow.pending.phase === 'count' && s.flow.pending.needsChoice, 'no count first');
  pacing.resolve(s, 'walk');
  pacing.advance(s);
  const w = s.flow.pending;
  assert(w?.kind === 'coldOpen' && w.phase === 'walk', `then ${w?.kind}/${w?.phase}`);
  const me = s.mps[s.player.mpId];
  assert(w.walk.seatId === me.seatId && w.walk.lines.length >= 4, 'the walk is not to your seat');
  assert(!w.walk.lines.some((l) => /\{\w+\}/.test(l)), 'a placeholder is left in the walk');
  assert(s.log.some((l) => l.kind === 'career' && l.text.startsWith('Election night in')), 'election night is not on the record');
  pacing.resolve(s);

  assert(s.flow.pending?.kind === 'morning' && s.date.absWeek === 0 && s.date.dayOfWeek === 1, `then ${s.flow.pending?.kind} on day ${s.date.dayOfWeek}`);
  const k = newGame({ seed: 'TEST-1', guided: true, coldOpen: true });
  pacing.resolve(k, 'skip');
  pacing.advance(k);
  assert(k.flow.pending?.kind === 'morning' && k.date.dayOfWeek === 1, `skip went to ${k.flow.pending?.kind}`);
  return w.walk.lines[2];
});

section('The memoir');

// A career played by the bot from election night to a given week.
function memoirCareer(seed, weeks) {
  const s = newGame({ seed, guided: true, coldOpen: true });
  const rng = createRng('bot' + seed);
  for (let i = 0; i < 400000; i++) {
    const p = s.flow.pending;
    if (p?.kind === 'dissolved' || p?.kind === 'ending' || s.date.absWeek >= weeks) break;
    botAct(s, rng);
  }
  return s;
}
const withoutMemoir = (s) => {
  const c = structuredClone(s);
  delete c.memoir;
  delete c.memoirSeq;
  delete c.memoirFrom;
  return JSON.stringify(c);
};

test('The memoir writes down the defining moments with the people in them, the same way every time, without moving the game', () => {
  const s = memoirCareer('MEMO-1', 40);
  const m = s.memoir;
  const first = m[0];
  assert(first?.kind === 'electionNight' && first.week === 0, `starts with ${first?.kind}`);
  assert(first.people.length === 2 && first.people[0].id === null && first.people[1].id === s.player.mentor, 'election night is missing the rival or the mentor');
  for (const kind of ['whipCall', 'confidence', 'firstRebellion']) assert(m.some((e) => e.kind === kind), `no ${kind}`);
  const reb = m.find((e) => e.kind === 'firstRebellion');
  assert(reb.people[0]?.note === data().memoir.notes.whip, 'the first rebellion leaves out the whip');
  assert(m.filter((e) => e.kind === 'firstRebellion').length === 1, 'the first rebellion is written down twice');
  assert(!m.some((e) => /\{\w+\}/.test(e.title + e.text)), 'a placeholder is left');
  assert(m.every((e, i) => i === 0 || e.week > m[i - 1].week || (e.week === m[i - 1].week && e.day >= m[i - 1].day)), 'the memoir is out of order');
  assert(m.every((e) => e.people.length <= tuning().memoir.peoplePerEntry && data().strings['memoir.kind.' + e.kind]), 'too many people, or a kind with no label');
  const again = memoirCareer('MEMO-1', 40);
  assert(JSON.stringify(again.memoir) === JSON.stringify(m), 'the same seed wrote a different memoir');
  const kinds = data().memoir.kinds;
  data().memoir.kinds = {};
  let blank;
  try {
    blank = memoirCareer('MEMO-1', 40);
  } finally {
    data().memoir.kinds = kinds;
  }
  assert(blank.memoir.length === 0 && withoutMemoir(blank) === withoutMemoir(s), 'writing the memoir changed the game');
  return `${m.length} moments by week 40: ${m.map((e) => e.key).slice(0, 6).join(', ')}…`;
});

test('A confidence vote goes in when it mattered, not every time the government held by thirty', () => {
  const s = memoirCareer('MEMO-2', 60);
  const votes = Object.values(s.divisions).filter((r) => r.recorded && s.bills[r.billId]?.confidence).length;
  const conf = s.memoir.filter((e) => e.kind === 'confidence');
  assert(conf.length >= 1, 'not even the first confidence vote');
  assert(conf.length < votes, `${conf.length} of ${votes} confidence votes written down`);
  return `${conf.length} of ${votes} confidence votes written down`;
});

test('An old save starts its memoir where it is and says so; a long career drops its small moments first', () => {
  const s = newGame({ seed: 'MEMO-3', guided: true });
  delete s.memoir;
  s.date.absWeek = 12;
  const e = memoir.remember(s, 'brokenPromise', { people: [] });
  assert(e && s.memoir.length === 1 && s.memoirFrom === 12, 'an old save did not start a memoir');
  const cap = tuning().memoir.cap;
  tuning().memoir.cap = 4;
  try {
    const mp = Object.values(s.mps).find((m) => m.id !== s.player.mpId);
    memoir.remember(s, 'lifeEvent', { sub: 'showUp', ctx: { name: 'A', what: 'x' }, people: [memoir.person(s, mp.id, 'x')] });
    for (let i = 0; i < 3; i++) memoir.remember(s, 'act3', { ctx: { whip: 'W', rival: 'R' } });
    assert(s.memoir.length === 4, `kept ${s.memoir.length}`);
    assert(!s.memoir.some((x) => x.kind === 'lifeEvent') && s.memoir[0].kind === 'brokenPromise', 'the small moment was not the one dropped');
  } finally {
    tuning().memoir.cap = cap;
  }
});

test('Faces are earned: a stranger is faceless, a talk gives a face, a second the feature, and time plus what you know the keepsake', () => {
  const s = newGame({ seed: 'FACE-1' });
  const before = parliamentHash(s);
  const mp = Object.values(s.mps).find((m) => m.party === s.mps[s.player.mpId].party && m.id !== s.player.mpId);
  const T = tuning().faces;
  assert(familiarity(s, s.player.mpId) === 3, 'the player does not know their own face');
  assert(familiarity(s, mp.id) === 0, 'a stranger already has a face');
  touch(s, mp.id);
  assert(familiarity(s, mp.id) === 1, `one talk gave tier ${familiarity(s, mp.id)}`);
  for (let i = 1; i < T.featureTalks; i++) touch(s, mp.id);
  assert(familiarity(s, mp.id) === 2, 'more talks did not give the feature');
  for (let i = T.featureTalks; i < T.signatureTalks; i++) touch(s, mp.id);
  assert(familiarity(s, mp.id) === 2, 'talking alone gave the keepsake');
  for (const f of HIDDEN_FIELDS.slice(0, T.signatureFields)) reveal(s, mp.id, f, 'meeting');
  assert(familiarity(s, mp.id) === 3, 'talks and knowledge did not give the keepsake');
  assert(familiarity(s, mp.id, T.signatureTalks) === 0, 'talksAgo does not look back');
  // A save from before talks were counted: any contact is one talk.
  delete s.player.talks;
  assert(familiarity(s, mp.id) === 1, 'an old save with contact is not tier 1');
  assert(parliamentHash(s) === before, 'knowing a face moved the Parliament');
});

test('A face is the same for the same member every time, and each tier only adds parts', () => {
  const s = newGame({ seed: 'FACE-2' });
  const ids = Object.keys(s.mps).slice(0, 40);
  for (const id of ids) {
    const a = JSON.stringify(faceFor(id, 3, { whiskers: true }));
    assert(a === JSON.stringify(faceFor(id, 3, { whiskers: true })), `${id}'s face changed`);
    const f = JSON.parse(a);
    assert(partsFor({ ...f, tier: 0 }).length === 0, `${id} has parts as a stranger`);
    let prev = [];
    for (let t = 1; t <= 3; t++) {
      const now = partsFor({ ...f, tier: t }).map(([k]) => k);
      assert(prev.every((k) => now.includes(k) || (k === 'brows' && now.includes('heavyBrows'))), `${id} lost a part at tier ${t}`);
      prev = now;
    }
    assert(!['beard', 'moustache'].includes(faceFor(id, 3, { whiskers: false }).feature), `${id} has whiskers off the list`);
  }
  const kinds = new Set(ids.map((id) => faceFor(id, 3, { whiskers: true }).feature));
  assert(kinds.size >= 5, `only ${kinds.size} features across forty members`);
  const m = s.mps[ids[3]];
  assert(faceOf(s, m.id).tier === 0 && faceOf(s, s.player.mpId).tier === 3, 'faceOf does not read familiarity');
  return `${kinds.size} features`;
});

section('Round three · Stakes at home');

const dilemmaOf = (s, b) => career.dilemmaFor(s, b, baseScore, tuning().pacing);

test('The riding numbers shown for each way of voting are exactly what the vote then does', () => {
  const T = tuning().player;
  for (const choice of ['line', 'rebel', 'absent']) {
    const s = newGame({ seed: 'TEST-1', party: 'p2', guided: true });
    const b = s.bills[s.player.forceDilemma];
    const pos = b.positions[s.mps[s.player.mpId].party];
    const shown = stakes.voteStakes(s, b, choice === 'line' ? pos : choice === 'rebel' ? (pos === 'yea' ? 'nay' : 'yea') : 'absent');
    const whip = s.parties[s.mps[s.player.mpId].party].chiefWhip;
    const r0 = s.mps[whip].rapport;
    const s0 = s.player.ridingStanding;
    career.applyPlayerVote(s, b, choice, dilemmaOf(s, b), T);
    assert(shown.whipped, 'the first week is a whipped vote');
    assert(s.player.ridingStanding - s0 === shown.riding, `${choice}: shown riding ${shown.riding}, actual ${s.player.ridingStanding - s0}`);
    assert(s.mps[whip].rapport - r0 === shown.whip, `${choice}: shown whip ${shown.whip}, actual ${s.mps[whip].rapport - r0}`);
  }
});

test('A free vote moves neither the riding nor the whip, and still reports which way home leans', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2', guided: true });
  const b = s.bills[s.player.forceDilemma];
  b.lines[s.mps[s.player.mpId].party] = 'free';
  const st = stakes.voteStakes(s, b, 'yea');
  assert(!st.whipped && st.riding === 0 && st.whip === 0, 'nothing moves on a free vote');
  assert(st.lean === null || ['yea', 'nay'].includes(st.lean.side), 'the riding\'s lean is still reported');
});

test('Deal cards say what they do at home: a riding project, a mention, a co-sponsorship, a promised vote', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2', guided: true });
  const P = tuning().player;
  assert(stakes.cardStakes(s, 'ridingProject', 'get').riding === P.ridingProjectStanding, 'project');
  assert(stakes.cardStakes(s, 'ridingMention', 'get').riding === P.ridingMentionStanding, 'mention');
  assert(stakes.cardStakes(s, 'ridingMention', 'give') === null, 'a mention you give does nothing at home');
  assert(stakes.cardStakes(s, 'favor', 'give') === null, 'a plain favour has no stake at home');
  const b = s.bills[s.player.forceDilemma];
  const pos = b.positions[s.mps[s.player.mpId].party];
  const v = stakes.cardStakes(s, `vote:${b.id}:${pos}`, 'give');
  assert(v && v.riding === stakes.voteStakes(s, b, pos).riding, 'a promised vote shows the vote\'s own stake');
  assert(stakes.cardStakes(s, `vote:${b.id}:${pos}`, 'get') === null, 'a vote promised to you is not your vote');
});

test('Signing on to a bill moves riding standing by exactly what the card showed', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2' });
  const me = s.mps[s.player.mpId];
  const sponsor = Object.values(s.bills).find((b) => b.status === 'active' && b.sponsor && b.sponsor !== me.id);
  if (!sponsor) return 'no sponsored bill in this Parliament';
  const shown = stakes.cardStakes(s, 'cosponsor', 'give', sponsor.sponsor);
  const r0 = s.player.ridingStanding;
  const done = stakes.applyCosponsor(s, sponsor.sponsor);
  assert(done.riding === shown.riding, 'same number');
  assert(s.player.ridingStanding === Math.max(0, Math.min(100, r0 + shown.riding)), 'standing moved by it');
  assert(Math.abs(shown.riding) <= tuning().meetings.cosponsorRiding, 'bounded by tuning');
  return `riding ${shown.riding >= 0 ? '+' : ''}${shown.riding} for ${sponsor.title}`;
});


test('Your row: the report lists exactly the row, friends are flagged, and the marks add up', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2', guided: true });
  ranks.assignRank(s, 3, 'assistantWhip');
  const row = ranks.rowOf(s);
  const r = rowSim.rowReport(s);
  assert(r.members.length === row.length && row.length > 0 && row.length <= 15, `row of ${row.length}`);
  const me = s.mps[s.player.mpId];
  for (const m of r.members) {
    assert(s.mps[m.id].party === me.party && m.id !== me.id, 'same party, never you');
    assert(['firm', 'leaning', 'lost', 'absent', 'unmarked'].includes(m.mark), 'a known mark');
  }
  assert(Object.values(r.counts).reduce((a, b) => a + b, 0) === r.members.length, 'counts cover everyone');
  const order = r.members.map((m) => rowSim.ROW_ORDER.indexOf(m.mark));
  assert(order.every((v, i) => i === 0 || order[i - 1] <= v), 'the ones needing attention come first');
  assert(rowSim.rowIds(s).size === row.length, 'rowIds matches rowOf');
  const some = r.members.find((m) => m.friend);
  if (some) assert(s.mps[some.id].cohort === me.cohort || (s.mps[some.id].relations[me.id] || 0) > 30 || s.mps[some.id].rapport > 25, 'friend means what the row\'s set piece means');
  return `${row.length} in the row · ${JSON.stringify(r.counts)}`;
});

test('Your row picks up marks from the count board for the next vote', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2', guided: true });
  ranks.assignRank(s, 3, 'assistantWhip');
  const bill = Object.values(s.bills).find((b) => b.status === 'active' && b.nextVote != null);
  if (!bill) return 'no vote scheduled at the start';

  assert(r.bill.id === rowSim.rowReport(s).bill.id, 'a bill is named');
  if (r.bill.id === bill.id) assert(r.members.find((m) => m.id === first.id).mark === 'lost', 'the mark shows');
});


test('Your row on the count board: the marks follow the vote asked for, and the line only shows from the whip\'s office on', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2', guided: true });
  ranks.assignRank(s, 3, 'assistantWhip');

test('Your row shows the side you need and where each member stands against it', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2', guided: true });
  ranks.assignRank(s, 3, 'assistantWhip');

  count.refreshMarks(s, bill.id);
  const r = rowSim.rowReport(s, bill.id);
  assert(r.want === tools.wantedSide(s, bill), 'the report names the side the whip needs');
  const V = tuning().vote;
  assert(r.scale.lower === V.lower && r.scale.upper === V.upper, 'the zones are the vote\'s own');
  assert(Math.sign(r.scale.firm) === (r.want === 'yea' ? 1 : -1), 'firm sits on the needed side');
  const sign = r.want === 'yea' ? 1 : -1;
  for (const m of r.members) {
    if (m.score == null) continue;
    if (m.mark === 'firm') assert(sign * m.score > Math.abs(r.scale.firm) - 1e-9, 'a firm mark is past the tick');
    if (m.mark === 'lost') assert(sign * m.score <= V.lower + 1e-9, 'a lost mark is in the other side\'s zone');
    if (m.mark === 'leaning') assert(sign * m.score > V.upper - 1e-9 && sign * m.score <= Math.abs(r.scale.firm) + 1e-9, 'a leaning mark is in our zone but short of firm');
  }
  assert(rowLine(s, bill.id).includes(r.want.toUpperCase()), 'the count line says which side');
  return `need ${r.want} · ${JSON.stringify(r.counts)}`;
});

test('A bill reads as "the … Act" mid-sentence, motions by their spoken name, and a sentence that opens on one gets its capital', () => {
  const tpls = data().billTemplates.templates;
  const motions = tpls.filter((x) => x.kind === 'oppositionMotion');
  assert(motions.every((x) => x.prose), 'a motion has no spoken name: ' + motions.find((x) => !x.prose)?.title);
  assert(tpls.every((x) => !x.prose || /^the [a-zA-Z]/.test(x.prose)), 'a spoken name should start "the …"');
  const s = newGame({ seed: 'NAMES-1' });

  assert(billName(motion) === 'the rent freeze motion', billName(motion));

  assert(fill('{bill} passes.', { bill: 'the X Act' }) === 'The X Act passes.', 'opening slot');
  assert(fill('A vote on {bill}.', { bill: 'the X Act' }) === 'A vote on the X Act.', 'mid-sentence slot');
  assert(fill('“Now. {bill}.”', { bill: 'the X Act' }) === '“Now. The X Act.”', 'after a full stop');
  assert(fill('“{bill} is whipped.”', { bill: 'the X Act' }) === '“The X Act is whipped.”', 'inside an opening quote');
  assert(fill('{a} and {b}', { a: 3 }) === '3 and {b}', 'numbers pass through and missing slots stay');
  // Every line in the data that names a bill, filled with each kind: no "the the", no sentence opening lower-case.
  const lines = [];
  const walk = (v) => (typeof v === 'string' ? v.includes('{bill}') && lines.push(v) : v && typeof v === 'object' && Object.values(v).forEach(walk));
  walk(data());
  for (const b of [act, motion]) {
    for (const line of lines) {

      assert(!/(^["“‘]?|[.!?]["”’]?\s+["“‘]?)the /.test(out), 'sentence opens lower-case: ' + out);

  // A whole Parliament played headless: nothing in the log puts a bill title straight after a preposition.
  const g = newGame({ seed: 'NAMES-2' });

  const bare = new RegExp(`\\b(on|for|to|about|against|of|before) (${titles.join('|')})`);

// Plays a game forward a stop at a time, toeing the line, until `until` says stop.
function playUntil(s, until, limit = 4000) {
  for (let i = 0; i < limit; i++) {
    const p = pacing.skip(s);
    if (p?.kind === 'dissolved' || p?.kind === 'ending') return p;
    if (until(s, p)) return p;
    pacing.resolve(s, p?.kind === 'division' ? 'line' : null);
  }
  throw new Error('ran out of stops at week ' + s.date.absWeek);
}

test('The guided first week has no big vote; from week two Monday puts a whipped vote down for Thursday', () => {
  const notes = [];
  for (const seed of ['BIG-1', 'BIG-2', 'BIG-3']) {
    const s = newGame({ seed, party: 'p1' });
    assert(!s.bigVote?.billId, `${seed}: a big vote in week one`);
    let guided = false;
    playUntil(s, (st) => {
      if (st.date.absWeek === 0 && st.bigVote?.billId) guided = true;
      return st.date.absWeek >= 1;
    });
    assert(!guided, `${seed}: the guided week got a big vote`);
    playUntil(s, (st) => st.bigVote?.billId && st.bigVote.week === st.date.absWeek);
    const bv = s.bigVote;
    assert(bv.week <= 3, `${seed}: no vote picked until week ${bv.week + 1}`);
    const bill = s.bills[bv.billId];
    const { line, position } = lineFor(bill, s.mps[s.player.mpId].party);
    assert(line === 'whipped' && position === bv.side, `${seed}: the week's vote isn't whipped ${bv.side}`);
    assert(bv.day === bv.week * 5 + 3 && bill.nextVote === bv.day && bill.scheduled, `${seed}: not down for Thursday`);
    assert(['close', 'safe', 'long'].includes(bv.outlook) && !bv.against.includes(s.player.mpId), `${seed}: outlook ${bv.outlook}`);
    assert(s.log.some((l) => l.week === bv.week && l.text.includes(billName(bill))), `${seed}: Monday's log doesn't name it`);
    notes.push(`${seed}: ${bv.outlook}, ${bv.start.ours}–${bv.start.theirs}`);
  }
  return notes.join(' · ');
});

test("Thursday's vote is the last division of the day, a recorded stop for the player, and settles on the record", () => {
  const s = newGame({ seed: 'BIG-1', party: 'p1' });
  playUntil(s, (st) => st.date.absWeek >= 1 && st.bigVote?.billId);
  const bv = s.bigVote;
  const early = [];
  const p = playUntil(s, (st, stop) => {
    for (const d of Object.values(st.divisions)) if (d.billId === bv.billId && d.day >= bv.week * 5 && d.day < bv.day) early.push(d.day);
    return stop?.kind === 'division' && stop.billId === bv.billId;
  });
  assert(!early.length, 'the bill was voted before Thursday');
  assert(s.date.dayOfWeek === 4, `the stop came on day ${s.date.dayOfWeek}`);
  assert(['bigVote', 'ownBill'].includes(p.reason), `stop reason ${p.reason}`);
  assert(s.flow.queue[s.flow.queue.length - 1].billId === bv.billId, 'not last on the paper');
  pacing.resolve(s, 'line');
  // Hold on to this week's vote: skipping on can run into next week's.
  playUntil(s, () => bv.result);
  const r = bv.result;
  assert(r, 'no result after Thursday');
  const d = s.divisions[r.divisionId];
  assert(d.recorded && d.billId === bv.billId && d.day === bv.day, 'not a recorded division on Thursday');
  assert(r.won === ((bv.side === 'yea') === d.carried), 'won is wrong');
  const rec = s.player.record.bigVotes;
  assert(rec && rec.won + rec.lost === 1, 'the record does not count it');
  assert(!s.log.some((l) => /\{\w+\}/.test(l.text)), 'a placeholder is left in the log');
  return `${billName(s.bills[bv.billId])}: ${d.yeas.length}–${d.nays.length}, ${r.won ? 'won' : 'lost'}`;
});

test('Names are yours only if you talked to them that week and they came into the lobby with you, or you chased them in', () => {
  const s = newGame({ seed: 'BIG-1', party: 'p1' });
  playUntil(s, (st) => st.date.absWeek >= 1 && st.bigVote?.billId);
  const bv = s.bigVote;
  const [a, b, c] = bv.against;
  const ours = Object.values(s.mps).find((m) => m.id !== s.player.mpId && !bv.against.includes(m.id)).id;
  s.player.contact = { ...(s.player.contact || {}), [a]: bv.week, [b]: bv.week - 1 };
  s.chased = { [bv.billId]: { [ours]: true, [c]: true } };
  const yes = bv.side;
  const no = yes === 'yea' ? 'nay' : 'yea';
  const d = { recorded: true, billId: bv.billId, day: bv.day, paired: [], yeas: [], nays: [] };
  const put = (id, v) => d[v + 's'].push(id);
  put(a, yes); put(b, yes); put(ours, yes); put(c, no);
  const n = bigVote.bigVoteNames(s, d);
  assert(JSON.stringify(n.turned) === JSON.stringify([a]), `turned ${n.turned}`);
  assert(JSON.stringify(n.chased) === JSON.stringify([ours]), `chased ${n.chased}`);
  assert(!bigVote.bigVoteNames(s, { ...d, day: bv.day - 1 }).turned.length, 'counted a vote on another day');
  assert(!bigVote.bigVoteNames(s, { ...d, compact: true }).turned.length, 'counted a compact division');
  return '1 turned, 1 chased; last week\'s talk and a vote against don\'t count';

test('What the vote is worth follows the job: a long shot lost costs nothing, a safe one lost costs most, names add up to a cap', () => {
  const B = tuning().bigVote;
  const s = newGame({ seed: 'BIG-1', party: 'p1' });
  playUntil(s, (st) => st.date.absWeek >= 1 && st.bigVote?.billId);
  const bill = s.bills[s.bigVote.billId];
  const good = { noticed: 1, whipRapport: 1, leaderTrust: 1, pressure: -1 };
  const notes = [];
  for (let act = 1; act <= 5; act++) {
    const P = B.payoutByAct[act - 1];
    assert(P.stat in good, `act ${act}: unknown stat ${P.stat}`);
    const k = good[P.stat];
    const pay = (outlook, won, names = []) => {
      const g = JSON.parse(JSON.stringify(s));
      g.player.act = act;
      g.player.leaderTrust = 50;
      g.pressure = 50;
      g.bigVote.outlook = outlook;
      // Act 3's rapport is with a chief whip who isn't the player.
      const whip = g.parties[g.mps[g.player.mpId].party].chiefWhip;
      if (whip === g.player.mpId) return null;
      return bigVote.payout(g, { ...bill, confidence: false }, won, names).delta * k;
    };
    const res = { closeWon: pay('close', true), safeWon: pay('safe', true), closeLost: pay('close', false), safeLost: pay('safe', false), longLost: pay('long', false) };
    if (res.closeWon == null) continue;
    assert(res.closeWon > 0 && res.safeWon >= 0 && res.closeWon >= res.safeWon, `act ${act}: winning ${JSON.stringify(res)}`);
    assert(res.longLost === 0, `act ${act}: a long shot lost costs ${res.longLost}`);
    assert(res.closeLost <= 0 && res.safeLost <= res.closeLost, `act ${act}: losing ${JSON.stringify(res)}`);
    const many = pay('close', true, Array(B.namesCap + 3).fill('x'));
    const capped = pay('close', true, Array(B.namesCap).fill('x'));
    assert(many === capped && capped > res.closeWon, `act ${act}: names ${capped} vs ${many}`);
    notes.push(`${act}: ${P.stat}`);
  }
  assert(notes.length >= 4, 'too few acts checked');
  return notes.join(' · ');
});

test("Every scenario's own vote is the week's vote, on Thursday", () => {

test('A whole Parliament: most sitting weeks have a big vote, each one settles once, and no line is left unfilled', () => {
  const s = newGame({ seed: 'BIG-PARL', party: 'p2' });
  const rng = createRng('bigparl');
  const weeks = new Set();
  const settled = new Set();
  for (let i = 0; i < 400000; i++) {
    const p = s.flow.pending;
    if (p?.kind === 'dissolved' || p?.kind === 'ending') break;
    botAct(s, rng);
    const bv = s.bigVote;
    if (bv?.billId) weeks.add(bv.week);
    if (bv?.result) settled.add(bv.week);
  }
  const sitting = new Set(Object.values(s.divisions).map((d) => Math.floor(d.day / 5))).size;
  assert(weeks.size >= sitting * 0.6, `${weeks.size} big votes in ${sitting} sitting weeks`);
  assert(settled.size >= weeks.size * 0.85, `${settled.size} of ${weeks.size} settled`);
  const rec = s.player.record.bigVotes;
  assert(rec.won + rec.lost <= settled.size, 'the record counts more than were settled');
  assert(!s.log.some((l) => /\{\w+\}/.test(l.text)), 'a placeholder is left in the log');
  return `${weeks.size} big votes in ${sitting} sitting weeks, ${rec.won} won, ${rec.lost} lost, ${rec.names} names`;
});

    out.appendChild(h);
    const ul = document.createElement('ul');
    out.appendChild(ul);
    for (const t of sec.tests) {
      const li = document.createElement('li');
      const t0 = performance.now();
      try {
        const note = await t.fn();
        pass++;
        li.innerHTML = `<span class="pass">✔</span> ${t.name} <small>${note ? note + ' · ' : ''}${Math.round(performance.now() - t0)} ms</small>`;
      } catch (e) {
        fail++;
        failures.push(`${t.name}: ${e.message}`);
        li.innerHTML = `<span class="fail">✘</span> ${t.name}<small>${e.stack || e.message}</small>`;
      }
      ul.appendChild(li);
      await new Promise((r) => setTimeout(r));
    }
  }
  const sum = document.getElementById('summary');
  sum.textContent = `${pass} passed, ${fail} failed`;
  sum.className = fail ? 'fail' : 'pass';
  sum.dataset.done = '1';
  sum.dataset.fail = String(fail);
  window.testResults = { pass, fail, failures };
}
run();
</script>
</body>
</html>
