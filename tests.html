const sections = [];

function section(name) {
  current = { name, tests: [] };
  sections.push(current);
}

  current.tests.push({ name, fn });
}
function assert(cond, msg) {
  if (!cond) throw new Error(msg || 'assertion failed');
}

const seatRec = new Map(buildSeats().map((s) => [s.seatId, s]));
const seatOf = (state, mpId) => seatRec.get(state.mps[mpId].seatId);

// ---------- Stage 2: MPs, parties, cohorts and cliques ----------
section('Stage 2 · Parliament generation');

test('Seed TEST-1 gives the same Parliament (hash, cohorts, cliques) on every load', () => {
  const a = newGame({ seed: 'TEST-1' });
  const b = newGame({ seed: 'TEST-1' });
  assert(parliamentHash(a) === parliamentHash(b), 'hash differs');
  assert(JSON.stringify(Object.values(a.mps).map((m) => [m.cohort, m.clique])) === JSON.stringify(Object.values(b.mps).map((m) => [m.cohort, m.clique])), 'cohorts or cliques differ');
  return `hash ${parliamentHash(a)}`;
});

test('Different seeds give different Parliaments', () => {
  assert(parliamentHash(newGame({ seed: 'TEST-1' })) !== parliamentHash(newGame({ seed: 'TEST-2' })));
});

test('Four core parties plus a generated fifth party are present, 120 MPs in all', () => {
  const s = newGame({ seed: 'TEST-1' });
  const names = Object.values(s.parties).map((p) => p.name);
  for (const n of ['National Union', 'Commonwealth Party', 'Labour Democrats', 'Eastern Compact']) assert(names.includes(n), `missing ${n}`);
  assert(s.parties.p5 && s.parties.p5.seats >= 1, 'no fifth party seats');
  assert(Object.keys(s.mps).length === 120, 'not 120 MPs');
  return `${names.join(', ')}`;
});

test('Seat counts per party equal party seat totals (the Speaker has no desk)', () => {
  for (const seed of ['TEST-1', 'SEED-17', 'SEED-8', 'SEED-34']) {
    const s = newGame({ seed });
    const seated = {};
    for (const { mpId } of Object.values(s.seats)) seated[s.mps[mpId].party] = (seated[s.mps[mpId].party] || 0) + 1;
    for (const p of Object.values(s.parties)) {
      const expect = p.seats - (s.mps[s.house.speaker].party === p.id ? 1 : 0);
      assert((seated[p.id] || 0) === expect, `${seed} ${p.short}: seated ${seated[p.id]} expected ${expect}`);
    }
    assert(Object.keys(s.seats).length === 119, `${seed}: ${Object.keys(s.seats).length} seated`);
  }
});

test('Whips sit where the spec says: Chief Whip row 2 first seat of the block, Deputy beside them', () => {
  const s = newGame({ seed: 'TEST-1' });
  for (const p of Object.values(s.parties)) {
    if (!p.chiefWhip || p.seats < 8) continue;
    const cw = seatOf(s, p.chiefWhip);
    const mates = Object.values(s.mps).filter((m) => m.party === p.id && m.seatId).map((m) => seatOf(s, m.id)).filter((x) => x.side === cw.side && x.row === 2);
    assert(cw.row === 2, `${p.short} chief whip in row ${cw.row}`);
    assert(mates.every((x) => x.index >= cw.index), `${p.short} chief whip not at the block's first seat`);
    if (p.deputyWhip) {
      const dw = seatOf(s, p.deputyWhip);
      assert(dw.row === 2 && mates.filter((x) => x.index < dw.index).length === 1, `${p.short} deputy whip not beside the chief whip`);
    }
  }
});

test('Cabinet and leaders sit in the front row on the government side', () => {
  const s = newGame({ seed: 'TEST-1' });
  const gov = s.parties[s.house.government];
  assert(seatOf(s, gov.leader).row === 1 && seatOf(s, gov.leader).side === 'gov', 'PM not in front row');
  const cab = Object.values(s.mps).filter((m) => m.caucusRole === 'cabinet');
  const front = cab.filter((m) => seatOf(s, m.id).row === 1).length;
  assert(front >= Math.min(cab.length, 10), `only ${front} of ${cab.length} ministers in row 1`);
});

test('Cliques sit together (contiguous within each party block)', () => {
  const s = newGame({ seed: 'TEST-1' });
  const roles = new Set(['backbencher', 'committeeChair']);
  for (const side of ['gov', 'opp']) {
    const order = buildSeats().filter((x) => x.side === side).sort((a, b) => a.index - b.index || a.row - b.row);
    const seqByParty = {};
    for (const seat of order) {
      const id = s.seats[seat.seatId]?.mpId;
      if (!id) continue;
      const m = s.mps[id];
      if (!roles.has(m.caucusRole) || !m.clique) continue;
      (seqByParty[m.party] ||= []).push(m.clique);
    }
    for (const [pid, seq] of Object.entries(seqByParty)) {
      const seen = new Set();
      for (let i = 0; i < seq.length; i++) {
        if (i > 0 && seq[i] === seq[i - 1]) continue;
        assert(!seen.has(seq[i]), `${pid} on ${side}: clique ${seq[i]} split`);
        seen.add(seq[i]);
      }
    }
  }
});

test('Every MP is in at most one clique and clique member lists agree', () => {
  const s = newGame({ seed: 'TEST-1' });
  for (const q of Object.values(s.cliques)) for (const id of q.members) assert(s.mps[id].clique === q.id, `${id} not marked in ${q.id}`);
  for (const m of Object.values(s.mps)) if (m.clique) assert(s.cliques[m.clique].members.includes(m.id), `${m.id} missing from ${m.clique}`);
  const per = {};
  for (const q of Object.values(s.cliques)) per[q.party] = (per[q.party] || 0) + 1;
  return Object.entries(per).map(([p, n]) => `${s.parties[p].short}:${n}`).join(' ');
});

test('A minority Parliament seats correctly (TEST-1)', () => {
  const s = newGame({ seed: 'TEST-1' });
  assert(s.house.minority, 'TEST-1 should be a minority');
  const gov = s.house.government;
  const govOnOpp = Object.values(s.mps).filter((m) => m.party === gov && m.seatId && seatOf(s, m.id).side === 'opp');
  assert(govOnOpp.length === 0, 'minority government should not overflow');
  const inds = Object.values(s.mps).filter((m) => m.party === 'ind');
  for (const m of inds) assert(seatOf(s, m.id).index >= 12, `independent ${m.id} not near the bar`);
});

test('A majority Parliament overflows onto the opposition back rows at the bar (SEED-17)', () => {
  const s = newGame({ seed: 'SEED-17' });
  assert(!s.house.minority, 'SEED-17 should be a majority');
  const gov = s.house.government;
  const over = Object.values(s.mps).filter((m) => m.party === gov && m.seatId && seatOf(s, m.id).side === 'opp');
  assert(over.length === s.parties[gov].seats - 1 - 60, `overflow ${over.length}`);
  for (const m of over) assert(seatOf(s, m.id).index === 15 || seatOf(s, m.id).index === 14, 'overflow not at the bar end');
  return `${over.length} government members across the aisle`;
});

test("A fresh game's card shows only name, party, riding and seat", () => {
  const s = newGame({ seed: 'TEST-1' });
  const other = Object.values(s.mps).find((m) => m.id !== s.player.mpId && m.seatId);
  const v = cardView(s, other.id);
  assert(v.name && v.party && v.riding && v.seatId, 'public facts missing');
  for (const f of HIDDEN_FIELDS) assert(!v.fields[f].known && v.fields[f].value === null, `${f} visible`);
});

test('The player is a rookie in their chosen party', () => {
  for (const party of ['p1', 'p2', 'p3', 'p4']) {
    const s = newGame({ seed: 'TEST-1', party });
    const m = s.mps[s.player.mpId];
    assert(m.party === party && m.tenure === 0 && m.caucusRole === 'backbencher', `${party}: ${m.party} ${m.tenure} ${m.caucusRole}`);
  }
});

test('Knowledge fields go stale after the tuned number of weeks without contact', () => {
  const s = newGame({ seed: 'TEST-1' });
  const id = Object.keys(s.mps).find((x) => x !== s.player.mpId);
  reveal(s, id, 'loyalty', 'test');
  s.date.absWeek = tuning().knowledge.staleWeeks - 1;
  decayKnowledge(s);
  assert(!cardView(s, id).fields.loyalty.stale, 'went stale too early');
  s.date.absWeek = tuning().knowledge.staleWeeks + 1;
  decayKnowledge(s);
  assert(cardView(s, id).fields.loyalty.stale, 'did not go stale');
});


// ---------- Stage 3: votes, divisions and pacing ----------
section('Stage 3 · Votes, divisions and pacing');

function billFrom(s, title) {
  const t = data().billTemplates.templates.find((x) => x.title === title);
  return makeBill(s, createRng('t:' + title), t);
}

test('Voice votes resolve without a division when nobody objects', () => {
  const s = newGame({ seed: 'TEST-1' });
  const rng = createRng('voice');
  const consensus = data().billTemplates.templates.filter((t) => t.kind === 'government' && Math.abs(t.position) <= 20 && t.visibility <= 45);
  let voices = 0;
  for (const t of consensus) {
    const b = makeBill(s, rng, t);
    // Make it uncontroversial: every party supports it.
    for (const pid of Object.keys(s.parties)) b.positions[pid] = 'yea';
    const q = putQuestion(s, { billId: b.id, stage: 'second' }, rng);
    if (!q.division) voices++;
  }
  assert(voices > 0, 'every consensus bill went to a division');
  return `${voices} of ${consensus.length} consensus bills carried on the voices`;
});

test('A contested question goes to a recorded division', () => {
  const s = newGame({ seed: 'TEST-1' });
  const b = billFrom(s, data().billTemplates.templates.find((t) => t.kind === 'oppositionMotion').title);
  const q = putQuestion(s, { billId: b.id, stage: 'motion' }, createRng('x'));
  assert(q.division, 'opposition motion carried on voices');
});

test('Divisions count standing members only and honour pairs', () => {
  const s = newGame({ seed: 'TEST-1' });
  const b = billFrom(s, 'Rural Roads Fund Act');
  const rng = createRng('pairs');
  const q = putQuestion(s, { billId: b.id, stage: 'second' }, rng);
  const ids = Object.keys(q.intents);
  // Force a known picture: two present members paired, one absent.
  const [a, c, absent] = [ids[3], ids[90], ids[10]];
  q.intents[a] = { ...q.intents[a], present: true, vote: 'yea' };
  q.intents[c] = { ...q.intents[c], present: true, vote: 'nay' };
  q.intents[absent] = { ...q.intents[absent], present: false, vote: 'yea' };
  s.pairs = [{ bill: b.id, a, b: c }];
  q.paired = new Set([a, c]);
  const r = runDivision(s, q);
  assert(!r.yeas.includes(a) && !r.nays.includes(c), 'paired members counted');
  assert(!r.yeas.includes(absent) && r.absent.includes(absent), 'absent member counted');
  const standing = Object.entries(q.intents).filter(([id, it]) => it.present && !q.paired.has(id) && it.vote !== 'abstain').length;
  assert(r.yeas.length + r.nays.length === standing, 'count differs from standing members');
  assert(r.paired.length === 1, 'pair not recorded');
});

test('A tie goes to the Speaker, who votes to keep the question open (Denison\'s rule)', () => {
  const s = newGame({ seed: 'TEST-1' });
  for (const stage of ['second', 'third']) {
    const b = billFrom(s, 'Rural Roads Fund Act');
    const q = putQuestion(s, { billId: b.id, stage }, createRng('tie' + stage));
    let flip = 'yea';
    for (const it of Object.values(q.intents)) {
      it.present = true;
      it.vote = flip;
      flip = flip === 'yea' ? 'nay' : 'yea';
    }
    // 119 members can't split evenly: send one home.
    Object.values(q.intents)[0].present = false;
    q.paired = new Set();
    s.pairs = [];
    const r = runDivision(s, q);
    assert(r.yeas.length === r.nays.length, 'not a tie');
    assert(r.speakerVote === speakerCastingVote(stage), 'wrong casting vote');
    assert(r.carried === (stage === 'second'), `tie at ${stage} should be ${stage === 'second' ? 'carried' : 'defeated'}`);
  }
});

test("Changing an MP's loyalty or clique lean changes their vote", () => {
  const s = newGame({ seed: 'TEST-1' });
  const b = billFrom(s, 'Rural Roads Fund Act');
  const before = intentions(s, b, createRng('same'));
  // Find a whipped MP voting the line, then make them disloyal and their clique restive.
  const target = Object.values(s.mps).find((m) => before[m.id] && before[m.id].line === 'whipped' && before[m.id].vote === before[m.id].position && m.clique && before[m.id].parts.I < 0);
  assert(target, 'no candidate MP');
  const was = before[target.id].vote;
  target.loyalty = 0;
  const afterLoyalty = intentions(s, b, createRng('same'))[target.id];
  s.cliques[target.clique].lean = -100;
  target.loyalty = 10;
  const afterClique = intentions(s, b, createRng('same'))[target.id];
  assert(afterLoyalty.score < before[target.id].score && afterClique.score < before[target.id].score + 0.001 || afterLoyalty.vote !== was, 'scores did not move');
  assert(afterLoyalty.vote !== was || afterClique.vote !== was, `vote stayed ${was}`);
  return `${target.name.first} ${target.name.last}: ${was} → ${afterLoyalty.vote} (loyalty 0) / ${afterClique.vote} (restive clique)`;
});

test('Bills move through all five stages, with amendments at committee and report', () => {
  const s = newGame({ seed: 'TEST-2' });
  for (let i = 0; i < 20000; i++) {
    const p = pacing.skip(s);
    if (p?.kind === 'dissolved') break;
    pacing.resolve(s, 'line');
    if (s.date.absWeek > 40) break;
  }
  const full = Object.values(s.bills).find((b) => b.status === 'passed' && b.kind === 'government' && b.results.length >= 3);
  assert(full, 'no bill passed all stages');
  const stages = full.results.map((id) => s.divisions[id].stage);
  assert(['second', 'report', 'third'].every((st) => stages.includes(st)), `stages seen: ${stages}`);
  const amends = Object.values(s.bills).flatMap((b) => b.amendments || []);
  assert(amends.some((a) => a.at === 'committee'), 'no committee amendments');
  assert(amends.some((a) => a.at === 'report'), 'no report stage amendments');
  return `${full.title}: first → ${stages.join(' → ')} → passed · ${amends.length} amendments`;
});

test('Routine days auto-resolve; the game only stops for days that matter; skip works', () => {
  const s = newGame({ seed: 'TEST-1' });
  const kinds = {};
  let days = new Set();
  for (let i = 0; i < 200; i++) {
    const p = pacing.skip(s);
    kinds[p.kind] = (kinds[p.kind] || 0) + 1;
    assert(p.needsChoice || p.important, `skip stopped on ${p.kind}`);
    if (p.kind === 'dissolved') break;
    pacing.resolve(s, 'line');
    if (s.date.absWeek > 12) break;
  }
  const loggedDays = new Set(s.log.map((l) => l.day)).size;
  const sittingDays = Math.min(s.date.absWeek, 12) * 4;
  assert(kinds.division > 0, 'never stopped');
  return `${JSON.stringify(kinds)} across ${s.date.absWeek} weeks (${loggedDays} days with log lines)`;
});

test('A lost confidence vote in a minority sets the election flag', () => {
  const s = newGame({ seed: 'TEST-1' });
  const b = billFrom(s, 'Main Estimates');
  const q = putQuestion(s, { billId: b.id, stage: 'motion' }, createRng('conf'));
  for (const [id, it] of Object.entries(q.intents)) {
    it.present = true;
    it.vote = s.mps[id].party === s.house.government ? 'yea' : 'nay';
  }
  const r = runDivision(s, q);
  assert(!r.carried, 'government won');
  recordResult(s, r, createRng('x'));
  assert(s.house.fallen && s.house.fallen.billId === b.id, 'fallen flag not set');
});

test('tests.html runs a whole Parliament headless with a random bot player, no errors, under a minute', () => {
  const t0 = performance.now();
  const out = [];
  for (const seed of ['TEST-1', 'BOT-2', 'BOT-3']) {
    const s = newGame({ seed, party: ['p1', 'p2', 'p3'][out.length] });
    const bot = createRng('bot:' + seed);
    let stops = 0;
    for (let i = 0; i < 100000; i++) {
      const p = pacing.skip(s);
      if (p.kind === 'dissolved') break;
      stops++;
      pacing.resolve(s, p.kind === 'division' ? bot.pick(['line', 'rebel', 'absent']) : null);
    }
    assert(s.flow.pending.kind === 'dissolved', 'did not reach dissolution');
    out.push(`${seed}: ${s.date.absWeek} weeks, ${Object.keys(s.divisions).length} votes, ${stops} stops${s.house.fallen ? ', government fell' : ''}`);
  }
  const ms = performance.now() - t0;
  assert(ms < 60000, `took ${ms} ms`);
  return out.join(' · ');
});


// ---------- Stage 4: the office and meetings ----------
section('Stage 4 · The office and meetings');

// Play to the first office evening.
function toOffice(seed, party) {
  const s = newGame({ seed, party });
  for (let i = 0; i < 400; i++) {
    const p = pacing.skip(s);
    if (p.kind === 'office') return s;
    if (p.kind === 'dissolved') break;
    pacing.resolve(s, 'line');
  }
  throw new Error('never reached the office');
}

test('After a sitting day the game moves to the office, then on to the next morning', () => {
  const s = toOffice('TEST-1');
  const day = s.date.dayOfWeek;
  const week = s.date.absWeek;
  assert(s.flow.step === 'fallout' && s.evening, 'not in the office evening');
  pacing.resolve(s);
  pacing.advance(s);
  assert(s.date.dayOfWeek !== day || s.date.absWeek !== week, 'did not move to the next day');
  assert(!s.evening, 'evening still open');
});

test('A meeting with a scripted choice sequence produces the expected ledger entry', () => {
  const s = toOffice('TEST-1');
  const target = Object.values(s.mps).find((m) => m.party === s.mps[s.player.mpId].party && m.id !== s.player.mpId && m.caucusRole === 'backbencher');
  ACTIONS.invite(s, { mpId: target.id });
  assert(s.flow.pending.kind === 'meeting', 'meeting did not start');
  const mt = s.meetings[s.meeting];
  while (mt.phase === 'talk') ACTIONS.talk(s, { index: mt.talk.options.findIndex((o) => o.approach === 'listen') });
  // Offer a riding mention, ask a favour: a fair trade for a friendly MP.
  target.rapport = 40;
  ACTIONS.propose(s, { offers: ['ridingMention'], asks: ['favor'] });
  assert(mt.deal.result === 'accepted', `deal ${mt.deal.result}`);
  const mine = s.ledger.find((e) => e.meeting === mt.id && e.from === s.player.mpId && e.what === 'ridingMention');
  const theirs = s.ledger.find((e) => e.meeting === mt.id && e.from === target.id && e.kind === 'favor');
  assert(mine && mine.to === target.id && mine.dueWeek != null, 'player promise missing');
  assert(theirs && theirs.to === s.player.mpId, 'favour owed missing');
  return `${mt.talk.turns.length} turns, ledger ${mine.id} and ${theirs.id}`;
});

test('Mood changes the available lines', () => {
  const lines = data().dialogueLines.lines.filter((l) => l.speaker === 'mp' && l.situation === 'introduction' && l.turn === 1);
  const byMood = Object.fromEntries(['cooperative', 'angry'].map((m) => [m, lines.filter((l) => l.mood.includes(m)).map((l) => l.id)]));
  assert(byMood.cooperative.length && byMood.angry.length, 'missing lines');
  assert(byMood.cooperative.every((id) => !byMood.angry.includes(id)), 'same lines for both moods');
});

test('Meetings reveal fields in the knowledge map', () => {
  const s = toOffice('TEST-2');
  const target = Object.values(s.mps).find((m) => m.id !== s.player.mpId && m.caucusRole === 'backbencher');
  ACTIONS.invite(s, { mpId: target.id });
  const mt = s.meetings[s.meeting];
  assert(cardView(s, target.id).fields.mood.known, 'mood not revealed on sitting down');
  target.mood = mt.mood = 'angry';
  while (mt.phase === 'talk') ACTIONS.talk(s, { index: Math.max(0, mt.talk.options.findIndex((o) => o.approach === 'listen')) });
  const known = HIDDEN_FIELDS.filter((f) => cardView(s, target.id).fields[f].known);
  assert(known.length >= 3, `only ${known.join(', ')} known`);
  return known.join(', ');
});

test("The whip's office calls the player in before a dilemma vote (the reversal)", () => {
  for (const seed of ['TEST-1', 'TEST-2', 'REV-3', 'REV-4', 'REV-5', 'REV-6']) {
    const s = newGame({ seed });
    for (let i = 0; i < 600; i++) {

      }
      if (p.kind === 'office') pacing.resolve(s);
      else pacing.resolve(s, 'line');
    }
  }
  throw new Error('no whip call found');
});

section('Stage 5 · Whip tools, the count and rival whips');

const SIGN5 = { yea: 1, nay: -1 };
// A game at a given act with a whipped government bill scheduled, and the decision noise off so results are exact.
function whipScenario(act, seed = 'TEST-1') {
  const s = newGame({ seed, party: 'p2', act });
  const rng = createRng('s5:' + seed);
  const b = introduceBill(s, rng, 'government', 'Rural Roads Fund Act');
  const me = s.mps[s.player.mpId];
  b.lines[me.party] = 'whipped';
  if (!SIGN5[b.positions[me.party]]) b.positions[me.party] = 'yea';
  return { s, b, me, rng };
}
function quiet(fn) {
  const V = tuning().vote;
  const noise = V.noise;
  V.noise = 0;
  try {
    return fn();
  } finally {
    V.noise = noise;
  }
}
// Put an MP's score just below (or well below) the yes threshold for the party's side, so a tool can flip them.
function setScoreAt(s, m, b, target) {
  const want = tools.wantedSide(s, b);
  const sgn = SIGN5[want];
  const base = baseScore5(s, m, b);
  s.nudges ||= {};
  s.nudges[m.id] = { [b.id]: sgn * target - base + (s.nudges[m.id]?.[b.id] || 0) };
  return want;
}
function baseScore5(s, m, b) {
  // Score without the current nudge, via the public model.
  const saved = s.nudges?.[m.id]?.[b.id] || 0;
  if (s.nudges?.[m.id]) s.nudges[m.id][b.id] = 0;
  const v = intentions(s, b, { normal: () => 0, next: () => 0 })[m.id].score;
  if (s.nudges?.[m.id]) s.nudges[m.id][b.id] = saved;
  return v;
}
const caucusOf = (s, me) => Object.values(s.mps).filter((m) => m.party === me.party && m.id !== me.id && m.caucusRole !== 'speaker');

test('Tools are gated by act as in DESIGN section 8', () => {
  const at = (act) => whipScenario(act).s;
  assert(tools.canUse(at(1), 'persuade').ok, 'persuade should be open in act 1');
  assert(!tools.canUse(at(1), 'chase').ok && tools.canUse(at(1), 'chase').reason === 'act', 'chase should wait for act 3');
  assert(tools.canUse(at(3), 'chase').ok, 'chase should open in act 3');
  assert(!tools.canUse(at(3), 'pair').ok && tools.canUse(at(4), 'pair').ok, 'pair opens in act 4');
  assert(!tools.canUse(at(4), 'qpSlot').ok && tools.canUse(at(5), 'qpSlot').ok, 'QP slots open in act 5');
  const five = at(5);
  assert(tools.canUse(five, 'expel').reason === 'leader', 'expulsion needs the leader');
  five.player.leaderTrust = 80;
  assert(tools.canUse(five, 'expel').ok, 'expulsion with the leader behind you');
  const { s, me } = whipScenario(1);
  const m = caucusOf(s, me)[0];
  assert(tools.canUse(s, 'leverage', m.id).reason === 'secret', 'leverage needs a known secret');
  return 'persuade 1 · chase 3 · pair/leave 4 · QP/committee/nomination/free vote/expel 5 · leverage once a secret is known';
});

test('Persuade flips a member who already half agrees', () =>
  quiet(() => {
    const { s, b, me } = whipScenario(1);

    assert(before !== want, `should start off the line, got ${before}`);
    const r = ACTIONS.useTool(s, { tool: 'persuade', mpId: m.id, billId: b.id });
    assert(r.ok && r.moved, 'persuade should report a flip: ' + JSON.stringify(r));
    const after = intentions(s, b, { normal: () => 0, next: () => 0 })[m.id].vote;
    assert(after === want, `expected ${want}, got ${after}`);
    assert(s.player.toolTime === tuning().tools.timePerWeek - tuning().tools.cost.persuade, 'persuade should cost House time');

test('Leverage and a nomination threat each flip a lost member; a riding project and a QP slot move a leaner', () =>
  quiet(() => {
    const { s, b, me } = whipScenario(5);
    const [a, c, d, e] = caucusOf(s, me);
    const want = tools.wantedSide(s, b);
    const vote = (m) => intentions(s, b, { normal: () => 0, next: () => 0 })[m.id].vote;
    setScoreAt(s, a, b, -0.6);
    a.secrets = [{ id: 'x1', severity: 2, known: false }];
    reveal(s, a.id, 'secrets', 'dig');
    assert(vote(a) !== want, 'a should start lost');
    assert(ACTIONS.useTool(s, { tool: 'leverage', mpId: a.id, billId: b.id }).ok, 'leverage');
    assert(vote(a) === want, 'leverage should flip a');
    setScoreAt(s, c, b, -0.5);
    assert(ACTIONS.useTool(s, { tool: 'threatenNomination', mpId: c.id, billId: b.id }).ok, 'threat');
    assert(vote(c) === want, 'the threat should flip c');
    assert(c.floorCrossRisk >= tuning().tools.nominationCrossRisk, 'threat raises floor-cross risk');
    setScoreAt(s, d, b, tuning().vote.upper - 0.3);
    // Riding projects are a government whip's tool; make this the government's caucus for the check.
    s.house.government = me.party;
    assert(ACTIONS.useTool(s, { tool: 'ridingProject', mpId: d.id }).ok, 'project');
    assert(vote(d) === want, 'a project should carry d');
    setScoreAt(s, e, b, tuning().vote.upper - 0.1);
    assert(ACTIONS.useTool(s, { tool: 'qpSlot', mpId: e.id, give: true }).ok, 'qp');
    assert(vote(e) === want, 'a QP slot should carry e');
    return `${a.name.last} (leverage), ${c.name.last} (nomination), ${d.name.last} (project), ${e.name.last} (QP) all vote ${want}`;
  }));

test("The count board's prediction matches the division within two votes when every mark is current", () =>

test('A new player starts in Act 1 in any party with a mentor, a cohort and a real dilemma vote', () => {

});

test('Rebelling and toeing the line both change the whip\'s file, riding standing and standing with the whip', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2', guided: true });
  const b = s.bills[s.player.forceDilemma];
  const me = s.mps[s.player.mpId];
  const whip = s.parties[me.party].chiefWhip;
  const d = career.dilemmaFor(s, b, (st, m, bl) => intentions(st, bl, { normal: () => 0, next: () => 0 })[m.id] ? { parts: intentions(st, bl, { normal: () => 0, next: () => 0 })[m.id].parts } : { parts: {} }, tuning().pacing);
  assert(d, 'the first week is a dilemma');
  const T = tuning().player;
  const r0 = s.mps[whip].rapport;
  const s0 = s.player.ridingStanding;
  career.applyPlayerVote(s, b, 'rebel', d, T);
  const rebelFile = s.player.whipFile.length;
  const rebelWhip = s.mps[whip].rapport - r0;
  const rebelRiding = s.player.ridingStanding - s0;
  const s2 = newGame({ seed: 'TEST-1', party: 'p2', guided: true });
  const b2 = s2.bills[s2.player.forceDilemma];
  const w2 = s2.parties[s2.mps[s2.player.mpId].party].chiefWhip;
  const d2 = { ...d };
  const r1 = s2.mps[w2].rapport;
  const t0 = s2.player.ridingStanding;
  career.applyPlayerVote(s2, b2, 'line', d2, T);
  const lineWhip = s2.mps[w2].rapport - r1;
  const lineRiding = s2.player.ridingStanding - t0;
  assert(rebelFile === 1 && s2.player.whipFile.length === 0, 'only the rebel gets a file');
  assert(rebelWhip < 0 && lineWhip > 0, `whip rapport: rebel ${rebelWhip}, line ${lineWhip}`);
  assert(rebelRiding > lineRiding, `riding: rebel ${rebelRiding}, line ${lineRiding}`);
  return `rebel: file 1, whip ${rebelWhip}, riding ${rebelRiding > 0 ? '+' : ''}${rebelRiding} · line: file 0, whip +${lineWhip}, riding ${lineRiding}`;
});

});

test('A private member\'s bill can be drawn, chosen, asked for across the aisle, questioned by the whip, and voted on', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2', act: 2 });
  const rng = createRng('pmb');
  // Reach a sitting Monday so the bill can be scheduled against the calendar.
  for (let i = 0; i < 200 && !(pacing.isSittingWeek(s) && s.date.dayOfWeek === 1 && s.date.absWeek >= 1); i++) { const p = pacing.next(s); if (p) pacing.resolve(s, p.kind === 'division' ? 'line' : null); }
  const draw = pmb.drawLottery(s, rng);
  assert(draw.event === 'lottery' && draw.options.length === 3, 'three bills to choose from');
  const bill = pmb.chooseBill(s, rng, draw.options[0].id);
  assert(bill.sponsor === s.player.mpId && bill.status === 'active' && bill.nextVote != null, 'the bill is the player\'s and scheduled');
  const seen = [];
  let asked = 0;
  for (let i = 0; i < 6000; i++) {
    const p = pacing.next(s);
    if (!p) continue;
    if (p.kind === 'career') {
      seen.push(p.event);
      if (p.event === 'crossAisle' && asked < 2 && p.options[0].id !== 'done') { asked++; pacing.resolve(s, p.options[0].id); continue; }
      pacing.resolve(s, p.event === 'crossAisle' ? 'done' : p.event === 'whipQuestion' ? 'explain' : null);
      continue;
    }
    if (p.kind === 'division') { pacing.resolve(s, p.reason === 'ownBill' ? 'yea' : 'line'); continue; }
    if (p.kind === 'dissolved') break;
    pacing.resolve(s, null);
    if (s.player.pmb?.settled) break;
  }
  assert(seen.includes('crossAisle'), 'the cross-aisle asks: ' + seen.join(','));
  assert(seen.includes('whipQuestion'), 'the whip asks why');
  assert(s.player.pmb.settled, 'the bill came to a vote');
  const d = Object.values(s.divisions).find((x) => x.billId === bill.id) || null;
  const line = s.log.find((l) => /passed second reading|was defeated/.test(l.text));
  assert(line, 'a result was logged');
  return `${bill.title}: asked ${asked} across the aisle, whip questioned; ${line.text}${d ? ` (${d.yeas.length}–${d.nays.length})` : ''}`;
});

test('Act 1 graduates to Act 2 by being noticed, with a reputation and a rival', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2' });
  s.date.absWeek = tuning().career.act1MinWeeks;
  s.player.actProgress.noticed = tuning().career.noticedForAct2;
  const p = runHooks6(pacing.hooks.weekend, s, createRng('g'));
  assert(p?.event === 'act2' && s.player.act === 2 && s.player.reputation === 'reliable' && s.player.rival, 'act 2 as reliable');
  const s2 = newGame({ seed: 'TEST-1', party: 'p2' });
  s2.date.absWeek = tuning().career.act1MinWeeks;
  s2.player.actProgress.noticed = tuning().career.noticedForAct2;
  s2.player.actProgress.rebellions = tuning().career.usefulTroubleRebellions;
  runHooks6(pacing.hooks.weekend, s2, createRng('g'));
  assert(s2.player.reputation === 'usefulTrouble', 'rebels graduate as useful trouble');
  const s3 = newGame({ seed: 'TEST-1', party: 'p2' });
  s3.date.absWeek = 30;
  s3.player.actProgress.noticed = 1;
  runHooks6(pacing.hooks.weekend, s3, createRng('g'));
  assert(s3.player.act === 1, 'nobody noticed: still act 1 at week 30');
  return `reliable vs useful trouble; rival ${s.mps[s.player.rival].name.last}; the unnoticed drift`;
});

test('Act 2 ends with a vacancy contest against the rival: win it and you are an assistant whip, lose it and you choose what next', () => {
  const setup = (seed) => {
    const s = newGame({ seed, party: 'p2', act: 2 });
    s.player.actStart = 0;
    s.date.absWeek = tuning().career.act2MinWeeks + 1;
    s.player.vacancyDue = s.date.absWeek;
    s.player.rival = career.pickRival(s);
    return s;
  };
  const w = setup('TEST-1');
  w.mps[w.parties.p2.chiefWhip].rapport = 100;
  w.player.actProgress.noticed = 40;
  w.mps[w.player.rival].loyalty = 0;
  w.mps[w.player.rival].ambition = 0;
  const v = runHooks6(pacing.hooks.weekend, w, createRng('v'));
  assert(v?.event === 'vacancy' && v.options.length === 3, 'a vacancy opens');
  w.flow.pending = v;
  pacing.resolve(w, 'askMentor');
  const after = pacing.next(w);
  assert(after?.event === 'act3' && w.player.act === 3 && w.mps[w.player.mpId].caucusRole === 'assistantWhip' && w.parties.p2.assistantWhips.includes(w.player.mpId), 'won the chair');
  const l = setup('TEST-1');
  l.mps[l.parties.p2.chiefWhip].rapport = -80;
  l.player.actProgress.rebellions = 6;
  l.mps[l.player.rival].loyalty = 100;
  l.mps[l.player.rival].ambition = 100;
  const v2 = runHooks6(pacing.hooks.weekend, l, createRng('v'));
  l.flow.pending = v2;
  pacing.resolve(l, 'letItRun');
  const lost = pacing.next(l);
  assert(lost?.event === 'lost' && l.player.act === 2 && l.mps[l.player.rival].caucusRole === 'assistantWhip', 'the rival got it');
  pacing.resolve(l, 'committeeChair');
  assert(l.mps[l.player.mpId].caucusRole === 'committeeChair' && l.player.vacancyDue > l.date.absWeek, 'took the chair and waits for the next vacancy');
  return `won ${after.score[0]} to ${after.score[1]} as assistant whip; lost ${lost.score[0]} to ${lost.score[1]}, took the committee chair`;
});

test('A life event asks you to show up for someone, and showing up is remembered', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2' });
  const me = s.mps[s.player.mpId];
  const m = Object.values(s.mps).find((x) => x.party === me.party && x.id !== me.id);
  const e = lifeEvents.newLifeEvent(s, createRng('life'), m);
  assert(e && m.lifeEvents.includes(e) && e.text.includes(m.name.first), 'event created with text');
  const r0 = m.rapport;
  s.flow.pending = { kind: 'career', event: 'lifeEvent', mpId: m.id, eventId: e.id, text: e.text, options: [] };
  pacing.resolve(s, 'showUp');
  assert(e.resolvedBy === me.id && m.rapport > r0 && (m.relations[me.id] || 0) > 0, 'showing up resolves it and builds the bond');
  return `${m.name.first} ${m.name.last}: ${e.kind}; rapport ${r0} → ${m.rapport}`;
});

async function run() {
  setData(await loadData());
  const out = document.getElementById('out');
  let pass = 0;
  let fail = 0;
  const failures = [];
  for (const sec of sections) {
    const h = document.createElement('h2');
    h.textContent = sec.name;
    out.appendChild(h);
    const ul = document.createElement('ul');
    out.appendChild(ul);
    for (const t of sec.tests) {
      const li = document.createElement('li');
      const t0 = performance.now();
      try {
        const note = await t.fn();
        pass++;
        li.innerHTML = `<span class="pass">✔</span> ${t.name} <small>${note ? note + ' · ' : ''}${Math.round(performance.now() - t0)} ms</small>`;
      } catch (e) {
        fail++;
        failures.push(`${t.name}: ${e.message}`);
        li.innerHTML = `<span class="fail">✘</span> ${t.name}<small>${e.stack || e.message}</small>`;
      }
      ul.appendChild(li);
      await new Promise((r) => setTimeout(r));
    }
  }
  const sum = document.getElementById('summary');
  sum.textContent = `${pass} passed, ${fail} failed`;
  sum.className = fail ? 'fail' : 'pass';
  sum.dataset.done = '1';
  sum.dataset.fail = String(fail);
  window.testResults = { pass, fail, failures };
}
run();
</script>
