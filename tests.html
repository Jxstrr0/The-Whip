// ---------- Stage 2: MPs, parties, cohorts and cliques ----------
section('Stage 2 · Parliament generation');

test('Seed TEST-1 gives the same Parliament (hash, cohorts, cliques) on every load', () => {
  const a = newGame({ seed: 'TEST-1' });
  const b = newGame({ seed: 'TEST-1' });
  assert(parliamentHash(a) === parliamentHash(b), 'hash differs');
  assert(JSON.stringify(Object.values(a.mps).map((m) => [m.cohort, m.clique])) === JSON.stringify(Object.values(b.mps).map((m) => [m.cohort, m.clique])), 'cohorts or cliques differ');
  return `hash ${parliamentHash(a)}`;
});

test('Different seeds give different Parliaments', () => {
  assert(parliamentHash(newGame({ seed: 'TEST-1' })) !== parliamentHash(newGame({ seed: 'TEST-2' })));
});

test('Four core parties plus a generated fifth party are present, 120 MPs in all', () => {
  const s = newGame({ seed: 'TEST-1' });
  const names = Object.values(s.parties).map((p) => p.name);
  for (const n of ['National Union', 'Commonwealth Party', 'Labour Democrats', 'Eastern Compact']) assert(names.includes(n), `missing ${n}`);
  assert(s.parties.p5 && s.parties.p5.seats >= 1, 'no fifth party seats');
  assert(Object.keys(s.mps).length === 120, 'not 120 MPs');
  return `${names.join(', ')}`;
});

test('Seat counts per party equal party seat totals (the Speaker has no desk)', () => {
  for (const seed of ['TEST-1', 'SEED-17', 'SEED-8', 'SEED-34']) {
    const s = newGame({ seed });
    const seated = {};
    for (const { mpId } of Object.values(s.seats)) seated[s.mps[mpId].party] = (seated[s.mps[mpId].party] || 0) + 1;
    for (const p of Object.values(s.parties)) {
      const expect = p.seats - (s.mps[s.house.speaker].party === p.id ? 1 : 0);
      assert((seated[p.id] || 0) === expect, `${seed} ${p.short}: seated ${seated[p.id]} expected ${expect}`);
    }
    assert(Object.keys(s.seats).length === 119, `${seed}: ${Object.keys(s.seats).length} seated`);
  }
});

test('Whips sit where the spec says: Chief Whip row 2 first seat of the block, Deputy beside them', () => {
  const s = newGame({ seed: 'TEST-1' });
  for (const p of Object.values(s.parties)) {
    if (!p.chiefWhip || p.seats < 8) continue;
    const cw = seatOf(s, p.chiefWhip);
    const mates = Object.values(s.mps).filter((m) => m.party === p.id && m.seatId).map((m) => seatOf(s, m.id)).filter((x) => x.side === cw.side && x.row === 2);
    assert(cw.row === 2, `${p.short} chief whip in row ${cw.row}`);
    assert(mates.every((x) => x.index >= cw.index), `${p.short} chief whip not at the block's first seat`);
    if (p.deputyWhip) {
      const dw = seatOf(s, p.deputyWhip);
      assert(dw.row === 2 && mates.filter((x) => x.index < dw.index).length === 1, `${p.short} deputy whip not beside the chief whip`);
    }
  }
});

test('Cabinet and leaders sit in the front row on the government side', () => {
  const s = newGame({ seed: 'TEST-1' });
  const gov = s.parties[s.house.government];
  assert(seatOf(s, gov.leader).row === 1 && seatOf(s, gov.leader).side === 'gov', 'PM not in front row');
  const cab = Object.values(s.mps).filter((m) => m.caucusRole === 'cabinet');
  const front = cab.filter((m) => seatOf(s, m.id).row === 1).length;
  assert(front >= Math.min(cab.length, 10), `only ${front} of ${cab.length} ministers in row 1`);
});

test('Cliques sit together (contiguous within each party block)', () => {
  const s = newGame({ seed: 'TEST-1' });
  const roles = new Set(['backbencher', 'committeeChair']);
  for (const side of ['gov', 'opp']) {
    const order = buildSeats().filter((x) => x.side === side).sort((a, b) => a.index - b.index || a.row - b.row);
    const seqByParty = {};
    for (const seat of order) {
      const id = s.seats[seat.seatId]?.mpId;
      if (!id) continue;
      const m = s.mps[id];
      if (!roles.has(m.caucusRole) || !m.clique) continue;
      (seqByParty[m.party] ||= []).push(m.clique);
    }
    for (const [pid, seq] of Object.entries(seqByParty)) {
      const seen = new Set();
      for (let i = 0; i < seq.length; i++) {
        if (i > 0 && seq[i] === seq[i - 1]) continue;
        assert(!seen.has(seq[i]), `${pid} on ${side}: clique ${seq[i]} split`);
        seen.add(seq[i]);
      }
    }
  }
});

test('Every MP is in at most one clique and clique member lists agree', () => {
  const s = newGame({ seed: 'TEST-1' });
  for (const q of Object.values(s.cliques)) for (const id of q.members) assert(s.mps[id].clique === q.id, `${id} not marked in ${q.id}`);
  for (const m of Object.values(s.mps)) if (m.clique) assert(s.cliques[m.clique].members.includes(m.id), `${m.id} missing from ${m.clique}`);
  const per = {};
  for (const q of Object.values(s.cliques)) per[q.party] = (per[q.party] || 0) + 1;
  return Object.entries(per).map(([p, n]) => `${s.parties[p].short}:${n}`).join(' ');
});

test('A minority Parliament seats correctly (TEST-1)', () => {
  const s = newGame({ seed: 'TEST-1' });
  assert(s.house.minority, 'TEST-1 should be a minority');
  const gov = s.house.government;
  const govOnOpp = Object.values(s.mps).filter((m) => m.party === gov && m.seatId && seatOf(s, m.id).side === 'opp');
  assert(govOnOpp.length === 0, 'minority government should not overflow');
  const inds = Object.values(s.mps).filter((m) => m.party === 'ind');
  for (const m of inds) assert(seatOf(s, m.id).index >= 12, `independent ${m.id} not near the bar`);
});

test('A majority Parliament overflows onto the opposition back rows at the bar (SEED-17)', () => {
  const s = newGame({ seed: 'SEED-17' });
  assert(!s.house.minority, 'SEED-17 should be a majority');
  const gov = s.house.government;
  const over = Object.values(s.mps).filter((m) => m.party === gov && m.seatId && seatOf(s, m.id).side === 'opp');
  assert(over.length === s.parties[gov].seats - 1 - 60, `overflow ${over.length}`);
  for (const m of over) assert(seatOf(s, m.id).index === 15 || seatOf(s, m.id).index === 14, 'overflow not at the bar end');
  return `${over.length} government members across the aisle`;
});

test("A fresh game's card shows only name, party, riding and seat", () => {
  const s = newGame({ seed: 'TEST-1' });
  const other = Object.values(s.mps).find((m) => m.id !== s.player.mpId && m.seatId);
  const v = cardView(s, other.id);
  assert(v.name && v.party && v.riding && v.seatId, 'public facts missing');
  for (const f of HIDDEN_FIELDS) assert(!v.fields[f].known && v.fields[f].value === null, `${f} visible`);
});

test('The player is a rookie in their chosen party', () => {
  for (const party of ['p1', 'p2', 'p3', 'p4']) {
    const s = newGame({ seed: 'TEST-1', party });
    const m = s.mps[s.player.mpId];
    assert(m.party === party && m.tenure === 0 && m.caucusRole === 'backbencher', `${party}: ${m.party} ${m.tenure} ${m.caucusRole}`);
  }
});

test('Knowledge fields go stale after the tuned number of weeks without contact', () => {
  const s = newGame({ seed: 'TEST-1' });
  const id = Object.keys(s.mps).find((x) => x !== s.player.mpId);
  reveal(s, id, 'loyalty', 'test');
  s.date.absWeek = tuning().knowledge.staleWeeks - 1;
  decayKnowledge(s);
  assert(!cardView(s, id).fields.loyalty.stale, 'went stale too early');
  s.date.absWeek = tuning().knowledge.staleWeeks + 1;
  decayKnowledge(s);
  assert(cardView(s, id).fields.loyalty.stale, 'did not go stale');
});


// ---------- Stage 3: votes, divisions and pacing ----------
section('Stage 3 · Votes, divisions and pacing');

function billFrom(s, title) {
  const t = data().billTemplates.templates.find((x) => x.title === title);
  return makeBill(s, createRng('t:' + title), t);
}

test('Voice votes resolve without a division when nobody objects', () => {
  const s = newGame({ seed: 'TEST-1' });
  const rng = createRng('voice');
  const consensus = data().billTemplates.templates.filter((t) => t.kind === 'government' && Math.abs(t.position) <= 20 && t.visibility <= 45);
  let voices = 0;
  for (const t of consensus) {
    const b = makeBill(s, rng, t);
    // Make it uncontroversial: every party supports it.
    for (const pid of Object.keys(s.parties)) b.positions[pid] = 'yea';
    const q = putQuestion(s, { billId: b.id, stage: 'second' }, rng);
    if (!q.division) voices++;
  }
  assert(voices > 0, 'every consensus bill went to a division');
  return `${voices} of ${consensus.length} consensus bills carried on the voices`;
});

test('A contested question goes to a recorded division', () => {
  const s = newGame({ seed: 'TEST-1' });
  const b = billFrom(s, data().billTemplates.templates.find((t) => t.kind === 'oppositionMotion').title);
  const q = putQuestion(s, { billId: b.id, stage: 'motion' }, createRng('x'));
  assert(q.division, 'opposition motion carried on voices');
});

test('Divisions count standing members only and honour pairs', () => {
  const s = newGame({ seed: 'TEST-1' });
  const b = billFrom(s, 'Rural Roads Fund Act');
  const rng = createRng('pairs');
  const q = putQuestion(s, { billId: b.id, stage: 'second' }, rng);
  const ids = Object.keys(q.intents);
  // Force a known picture: two present members paired, one absent.
  const [a, c, absent] = [ids[3], ids[90], ids[10]];
  q.intents[a] = { ...q.intents[a], present: true, vote: 'yea' };
  q.intents[c] = { ...q.intents[c], present: true, vote: 'nay' };
  q.intents[absent] = { ...q.intents[absent], present: false, vote: 'yea' };
  s.pairs = [{ bill: b.id, a, b: c }];
  q.paired = new Set([a, c]);
  const r = runDivision(s, q);
  assert(!r.yeas.includes(a) && !r.nays.includes(c), 'paired members counted');
  assert(!r.yeas.includes(absent) && r.absent.includes(absent), 'absent member counted');
  const standing = Object.entries(q.intents).filter(([id, it]) => it.present && !q.paired.has(id) && it.vote !== 'abstain').length;
  assert(r.yeas.length + r.nays.length === standing, 'count differs from standing members');
  assert(r.paired.length === 1, 'pair not recorded');
});

test('A tie goes to the Speaker, who votes to keep the question open (Denison\'s rule)', () => {
  const s = newGame({ seed: 'TEST-1' });
  for (const stage of ['second', 'third']) {
    const b = billFrom(s, 'Rural Roads Fund Act');
    const q = putQuestion(s, { billId: b.id, stage }, createRng('tie' + stage));
    let flip = 'yea';
    for (const it of Object.values(q.intents)) {
      it.present = true;
      it.vote = flip;
      flip = flip === 'yea' ? 'nay' : 'yea';
    }
    // 119 members can't split evenly: send one home.
    Object.values(q.intents)[0].present = false;
    q.paired = new Set();
    s.pairs = [];
    const r = runDivision(s, q);
    assert(r.yeas.length === r.nays.length, 'not a tie');
    assert(r.speakerVote === speakerCastingVote(stage), 'wrong casting vote');
    assert(r.carried === (stage === 'second'), `tie at ${stage} should be ${stage === 'second' ? 'carried' : 'defeated'}`);
  }
});

test("Changing an MP's loyalty or clique lean changes their vote", () => {
  const s = newGame({ seed: 'TEST-1' });
  const b = billFrom(s, 'Rural Roads Fund Act');
  const before = intentions(s, b, createRng('same'));
  // Find a whipped MP voting the line, then make them disloyal and their clique restive.
  const target = Object.values(s.mps).find((m) => before[m.id] && before[m.id].line === 'whipped' && before[m.id].vote === before[m.id].position && m.clique && before[m.id].parts.I < 0);
  assert(target, 'no candidate MP');
  const was = before[target.id].vote;
  target.loyalty = 0;
  const afterLoyalty = intentions(s, b, createRng('same'))[target.id];
  s.cliques[target.clique].lean = -100;
  target.loyalty = 10;
  const afterClique = intentions(s, b, createRng('same'))[target.id];
  assert(afterLoyalty.score < before[target.id].score && afterClique.score < before[target.id].score + 0.001 || afterLoyalty.vote !== was, 'scores did not move');
  assert(afterLoyalty.vote !== was || afterClique.vote !== was, `vote stayed ${was}`);
  return `${target.name.first} ${target.name.last}: ${was} → ${afterLoyalty.vote} (loyalty 0) / ${afterClique.vote} (restive clique)`;
});

test('Bills move through all five stages, with amendments at committee and report', () => {
  const s = newGame({ seed: 'TEST-2' });
  for (let i = 0; i < 20000; i++) {
    const p = pacing.skip(s);
    if (p?.kind === 'dissolved') break;
    pacing.resolve(s, 'line');
    if (s.date.absWeek > 40) break;
  }
  const full = Object.values(s.bills).find((b) => b.status === 'passed' && b.kind === 'government' && b.results.length >= 3);
  assert(full, 'no bill passed all stages');
  const stages = full.results.map((id) => s.divisions[id].stage);
  assert(['second', 'report', 'third'].every((st) => stages.includes(st)), `stages seen: ${stages}`);
  const amends = Object.values(s.bills).flatMap((b) => b.amendments || []);
  assert(amends.some((a) => a.at === 'committee'), 'no committee amendments');
  assert(amends.some((a) => a.at === 'report'), 'no report stage amendments');
  return `${full.title}: first → ${stages.join(' → ')} → passed · ${amends.length} amendments`;
});

test('Routine days auto-resolve; the game only stops for days that matter; skip works', () => {
  const s = newGame({ seed: 'TEST-1' });
  const kinds = {};
  let days = new Set();
  for (let i = 0; i < 200; i++) {
    const p = pacing.skip(s);
    kinds[p.kind] = (kinds[p.kind] || 0) + 1;
    assert(p.needsChoice || p.important, `skip stopped on ${p.kind}`);
    if (p.kind === 'dissolved') break;
    pacing.resolve(s, 'line');
    if (s.date.absWeek > 12) break;
  }
  const loggedDays = new Set(s.log.map((l) => l.day)).size;
  const sittingDays = Math.min(s.date.absWeek, 12) * 4;
  assert(kinds.division > 0, 'never stopped');
  return `${JSON.stringify(kinds)} across ${s.date.absWeek} weeks (${loggedDays} days with log lines)`;
});

test('A lost confidence vote in a minority sets the election flag', () => {
  const s = newGame({ seed: 'TEST-1' });
  const b = billFrom(s, 'Main Estimates');
  const q = putQuestion(s, { billId: b.id, stage: 'motion' }, createRng('conf'));
  for (const [id, it] of Object.entries(q.intents)) {
    it.present = true;
    it.vote = s.mps[id].party === s.house.government ? 'yea' : 'nay';
  }
  const r = runDivision(s, q);
  assert(!r.carried, 'government won');
  recordResult(s, r, createRng('x'));
  assert(s.house.fallen && s.house.fallen.billId === b.id, 'fallen flag not set');
});

test('tests.html runs a whole Parliament headless with a random bot player, no errors, under a minute', () => {
  const t0 = performance.now();
  const out = [];
  for (const seed of ['TEST-1', 'BOT-2', 'BOT-3']) {
    const s = newGame({ seed, party: ['p1', 'p2', 'p3'][out.length] });
    const bot = createRng('bot:' + seed);
    let stops = 0;
    for (let i = 0; i < 100000; i++) {
      const p = pacing.skip(s);
      if (p.kind === 'dissolved') break;
      stops++;
      pacing.resolve(s, p.kind === 'division' ? bot.pick(['line', 'rebel', 'absent']) : null);
    }
    assert(s.flow.pending.kind === 'dissolved', 'did not reach dissolution');
    out.push(`${seed}: ${s.date.absWeek} weeks, ${Object.keys(s.divisions).length} votes, ${stops} stops${s.house.fallen ? ', government fell' : ''}`);
  }
  const ms = performance.now() - t0;
  assert(ms < 60000, `took ${ms} ms`);
  return out.join(' · ');
});


// ---------- Stage 4: the office and meetings ----------
section('Stage 4 · The office and meetings');

// Play to the first office evening.
function toOffice(seed, party) {
  const s = newGame({ seed, party });
  for (let i = 0; i < 400; i++) {
    const p = pacing.skip(s);
    if (p.kind === 'office') return s;
    if (p.kind === 'dissolved') break;
    pacing.resolve(s, 'line');
  }
  throw new Error('never reached the office');
}

test('After a sitting day the game moves to the office, then on to the next morning', () => {
  const s = toOffice('TEST-1');
  const day = s.date.dayOfWeek;
  const week = s.date.absWeek;
  assert(s.flow.step === 'fallout' && s.evening, 'not in the office evening');
  pacing.resolve(s);
  pacing.advance(s);
  assert(s.date.dayOfWeek !== day || s.date.absWeek !== week, 'did not move to the next day');
  assert(!s.evening, 'evening still open');
});

test('A meeting with a scripted choice sequence produces the expected ledger entry', () => {
  const s = toOffice('TEST-1');
  const target = Object.values(s.mps).find((m) => m.party === s.mps[s.player.mpId].party && m.id !== s.player.mpId && m.caucusRole === 'backbencher');
  ACTIONS.invite(s, { mpId: target.id });
  assert(s.flow.pending.kind === 'meeting', 'meeting did not start');
  const mt = s.meetings[s.meeting];
  for (let i = 0; i < 6 && mt.phase === 'talk'; i++) {
    const listen = mt.talk.options.findIndex((o) => o.approach === 'listen');
    assert(listen >= 0, 'no way to listen on turn ' + mt.turn + ': ' + mt.talk.options.map((o) => o.approach).join(', '));
    ACTIONS.talk(s, { index: listen });
  }
  assert(mt.phase !== 'talk', 'the talk never ended');
  // Offer a riding mention, ask a favour: a fair trade for a friendly MP.
  target.rapport = 40;
  ACTIONS.propose(s, { offers: ['ridingMention'], asks: ['favor'] });
  assert(mt.deal.result === 'accepted', `deal ${mt.deal.result}`);
  const mine = s.ledger.find((e) => e.meeting === mt.id && e.from === s.player.mpId && e.what === 'ridingMention');
  const theirs = s.ledger.find((e) => e.meeting === mt.id && e.from === target.id && e.kind === 'favor');
  assert(mine && mine.to === target.id && mine.dueWeek != null, 'player promise missing');
  assert(theirs && theirs.to === s.player.mpId, 'favour owed missing');
  return `${mt.talk.turns.length} turns, ledger ${mine.id} and ${theirs.id}`;
});

test('Mood changes the available lines', () => {
  const lines = data().dialogueLines.lines.filter((l) => l.speaker === 'mp' && l.situation === 'introduction' && l.turn === 1);
  const byMood = Object.fromEntries(['cooperative', 'angry'].map((m) => [m, lines.filter((l) => l.mood.includes(m)).map((l) => l.id)]));
  assert(byMood.cooperative.length && byMood.angry.length, 'missing lines');
  assert(byMood.cooperative.every((id) => !byMood.angry.includes(id)), 'same lines for both moods');
});

test('Meetings reveal fields in the knowledge map', () => {

test("The whip's office calls the player in before a dilemma vote (the reversal)", () => {
  for (const seed of ['TEST-1', 'TEST-2', 'REV-3', 'REV-4', 'REV-5', 'REV-6']) {
    const s = newGame({ seed });
    for (let i = 0; i < 600; i++) {
      const p = pacing.skip(s);
      if (p.kind === 'dissolved') break;
      if (p.kind === 'office' && s.evening.whipCall) {
        ACTIONS.meet(s, { whipCall: true });
        const mt = s.meetings[s.meeting];
        assert(mt.reversal && mt.mpId === s.parties[s.mps[s.player.mpId].party].chiefWhip, 'not the whip in the reversal');

        return `${seed}: whip calls about ${s.bills[mt.billId].title}`;
      }
      if (p.kind === 'office') pacing.resolve(s);
      else pacing.resolve(s, 'line');

});

test('A guided first week visits all four rooms in order and ends at the weekend review', () => {
  const out = [];
  for (const party of ['p1', 'p2', 'p3', 'p4']) {
    const s = newGame({ seed: 'SLICE-' + party, party, guided: true });

    const seen = [];
    for (let i = 0; i < 4000; i++) {
      const p = s.flow.pending;

      if (p && seen[seen.length - 1] !== p.kind) seen.push(p.kind);
      botAct(s, rng);

    assert(s.flow.pending?.kind === 'weekSummary' && s.flow.pending.firstWeek, `${party}: never reached the first-week review`);
    for (const k of ['morning', 'office', 'meeting', 'caucus', 'division', 'riding']) assert(seen.includes(k), `${party}: no ${k} stop`);
    const firstCaucus = seen.indexOf('caucus');

    assert(firstCaucus < firstDivision && firstDivision < firstRiding, `${party}: rooms out of order`);
    const whipMet = Object.values(s.meetings).some((m) => m.reversal);

    out.push(`${s.parties[party].short}: ${s.player.whipFile.length ? 'rebelled' : 'toed the line'}, riding ${s.player.ridingStanding}`);

});

section('Stage 5 · Whip tools, the count and rival whips');

const SIGN5 = { yea: 1, nay: -1 };
// A game at a given act with a whipped government bill scheduled, and the decision noise off so results are exact.
function whipScenario(act, seed = 'TEST-1') {
  const s = newGame({ seed, party: 'p2', act });
  const rng = createRng('s5:' + seed);
  const b = introduceBill(s, rng, 'government', 'Rural Roads Fund Act');
  const me = s.mps[s.player.mpId];
  b.lines[me.party] = 'whipped';
  if (!SIGN5[b.positions[me.party]]) b.positions[me.party] = 'yea';
  return { s, b, me, rng };
}
function quiet(fn) {
  const V = tuning().vote;
  const noise = V.noise;
  V.noise = 0;
  try {
    return fn();
  } finally {
    V.noise = noise;
  }
}
// Put an MP's score just below (or well below) the yes threshold for the party's side, so a tool can flip them.
function setScoreAt(s, m, b, target) {
  const want = tools.wantedSide(s, b);
  const sgn = SIGN5[want];
  const base = baseScore5(s, m, b);
  s.nudges ||= {};
  s.nudges[m.id] = { [b.id]: sgn * target - base + (s.nudges[m.id]?.[b.id] || 0) };
  return want;
}
function baseScore5(s, m, b) {
  // Score without the current nudge, via the public model.
  const saved = s.nudges?.[m.id]?.[b.id] || 0;
  if (s.nudges?.[m.id]) s.nudges[m.id][b.id] = 0;
  const v = intentions(s, b, { normal: () => 0, next: () => 0 })[m.id].score;
  if (s.nudges?.[m.id]) s.nudges[m.id][b.id] = saved;
  return v;
}
const caucusOf = (s, me) => Object.values(s.mps).filter((m) => m.party === me.party && m.id !== me.id && m.caucusRole !== 'speaker');

test('Tools are gated by act as in DESIGN section 8', () => {
  const at = (act) => whipScenario(act).s;
  assert(tools.canUse(at(1), 'persuade').ok, 'persuade should be open in act 1');
  assert(!tools.canUse(at(1), 'chase').ok && tools.canUse(at(1), 'chase').reason === 'act', 'chase should wait for act 3');
  assert(tools.canUse(at(3), 'chase').ok, 'chase should open in act 3');
  assert(!tools.canUse(at(3), 'pair').ok && tools.canUse(at(4), 'pair').ok, 'pair opens in act 4');
  assert(!tools.canUse(at(4), 'qpSlot').ok && tools.canUse(at(5), 'qpSlot').ok, 'QP slots open in act 5');
  const five = at(5);
  assert(tools.canUse(five, 'expel').reason === 'leader', 'expulsion needs the leader');
  five.player.leaderTrust = 80;
  assert(tools.canUse(five, 'expel').ok, 'expulsion with the leader behind you');
  const { s, me } = whipScenario(1);
  const m = caucusOf(s, me)[0];
  assert(tools.canUse(s, 'leverage', m.id).reason === 'secret', 'leverage needs a known secret');
  return 'persuade 1 · chase 3 · pair/leave 4 · QP/committee/nomination/free vote/expel 5 · leverage once a secret is known';
});

test('Persuade flips a member who already half agrees', () =>
  quiet(() => {
    const { s, b, me } = whipScenario(1);
    const m = caucusOf(s, me)[3];
    const want = setScoreAt(s, m, b, tuning().vote.upper - 0.1);
    const before = intentions(s, b, { normal: () => 0, next: () => 0 })[m.id].vote;
    assert(before !== want, `should start off the line, got ${before}`);
    const r = ACTIONS.useTool(s, { tool: 'persuade', mpId: m.id, billId: b.id });
    assert(r.ok && r.moved, 'persuade should report a flip: ' + JSON.stringify(r));
    const after = intentions(s, b, { normal: () => 0, next: () => 0 })[m.id].vote;
    assert(after === want, `expected ${want}, got ${after}`);
    assert(s.player.toolTime === tuning().tools.timePerWeek - tuning().tools.cost.persuade, 'persuade should cost House time');
    return `${m.name.first} ${m.name.last}: ${before} → ${after}`;
  }));

test('A chase during the bells puts an absent member in their seat', () =>
  quiet(() => {
    const { s, b, me } = whipScenario(3);
    const m = caucusOf(s, me)[1];
    m.attendance = -200; // certain to be away
    setScoreAt(s, m, b, 1.5);
    const bells = tools.openBells(s, b, 'second', 30);
    assert(bells?.away[m.id]?.where, 'they should be on the map of the Hill');
    const before = intentions(s, b, createRng('att'))[m.id];
    assert(!before.present, 'should be absent before the chase');
    const P = tuning().tools.chase.places;
    const odds = Object.fromEntries(Object.entries(P).map(([k, v]) => [k, v.odds]));
    for (const v of Object.values(P)) v.odds = 1;
    const r = ACTIONS.useTool(s, { tool: 'chase', mpId: m.id, billId: b.id, secsLeft: 30 });
    for (const [k, v] of Object.entries(odds)) P[k].odds = v;
    assert(r.ok && r.found, 'chase should find them: ' + JSON.stringify(r));
    const after = intentions(s, b, createRng('att'))[m.id];
    assert(after.present && after.vote === tools.wantedSide(s, b), 'chased member should be present and voting the line');
    return `found ${r.where}, ${r.trip}s there and back; present ${before.present} → ${after.present}`;
  }));

test('The bells: who is away comes from the seed, and the clock and the staff limit the chase', () =>
  quiet(() => {
    const { s, b, me } = whipScenario(3);
    const [m1, m2] = caucusOf(s, me).slice(2, 4);
    for (const m of [m1, m2]) {
      m.attendance = -200;
      setScoreAt(s, m, b, 1.5);
    }
    const rngBefore = JSON.stringify(s.rng);
    const bells = tools.openBells(s, b, 'second', 30);
    assert(JSON.stringify(s.rng) === rngBefore, 'opening the bells must not touch the RNG');
    assert(JSON.stringify(tools.bellsAway(s, b, 'second')) === JSON.stringify(bells.away), 'the same seed, bill and stage give the same list');
    assert(bells.away[m1.id]?.where && bells.away[m2.id]?.where, 'both should be on the map');
    // Everyone of ours not on the list is in the building for this vote.
    const ints = intentions(s, b, createRng('x'));
    const wrong = caucusOf(s, me).filter((m) => ints[m.id].vote !== 'abstain' && ints[m.id].present === !!bells.away[m.id]);
    assert(!wrong.length, 'the list is the attendance: ' + wrong.map((m) => m.id).join(','));
    const P = tuning().tools.chase.places;
    const odds = Object.fromEntries(Object.entries(P).map(([k, v]) => [k, v.odds]));
    for (const v of Object.values(P)) v.odds = 1;
    try {
      const countBefore = count.prediction(s, b.id).ours;
      assert(tools.runners(s) === 1, 'one pair of legs in act 3');
      const far = ACTIONS.useTool(s, { tool: 'chase', mpId: m1.id, billId: b.id, secsLeft: bells.away[m1.id].trip - 1 });
      assert(!far.ok && far.reason === 'far', 'a trip that cannot beat the doors is refused: ' + JSON.stringify(far));
      const r1 = ACTIONS.useTool(s, { tool: 'chase', mpId: m1.id, billId: b.id, secsLeft: 30 });
      assert(r1.ok && r1.found, 'first chase goes: ' + JSON.stringify(r1));
      const busy = ACTIONS.useTool(s, { tool: 'chase', mpId: m2.id, billId: b.id, secsLeft: 30 - 0.5 });
      const left = r1.back;
      assert(!busy.ok && busy.reason === 'runners', 'the only runner is out: ' + JSON.stringify(busy));
      const r2 = ACTIONS.useTool(s, { tool: 'chase', mpId: m2.id, billId: b.id, secsLeft: left });
      assert(r2.ok || r2.reason === 'far', 'back in time to go again: ' + JSON.stringify(r2));
      assert(count.prediction(s, b.id).ours > countBefore, 'the count should move as they come in');
      assert(s.player.toolTime === tuning().tools.timePerWeek - tuning().tools.cost.chase * (r2.ok ? 2 : 1), 'each run costs House time, refusals cost nothing');
      const ledger = s.ledger.length;
      for (const fn of pacing.hooks.doorsClose) fn(s, { billId: b.id, stage: 'second' });
      assert(s.ledger.length === ledger + s.bells.runs.length, 'every run goes in the ledger when the doors close');
      const line = s.log[s.log.length - 1].text;
      assert(line.includes(b.title) && !/[{}]/.test(line), 'one line in the log: ' + line);
      return `${Object.keys(bells.away).length} away · ${s.bells.runs.length} fetched · count ${countBefore} → ${count.prediction(s, b.id).ours} · "${line}"`;
    } finally {
      for (const [k, v] of Object.entries(odds)) P[k].odds = v;
    }
  }));

test('Every Hill line fills, and the map has a spot for every place', () => {
  const H = data().hill;
  const lines = [...H.found, ...Object.values(H.missed).flat()];
  for (const where of Object.keys(tuning().tools.chase.places)) {
    assert(H.places[where]?.spots.length >= 3, `${where} needs spots`);
    assert(H.missed[where]?.length >= 2, `${where} needs missed lines`);
  }
  for (const l of lines) for (const sp of Object.values(H.places).flatMap((p) => p.spots)) {
    const out = l.replace('{name}', 'Ada Moss').replace('{spot}', sp.text);
    assert(!/[{}]/.test(out), 'unfilled: ' + out);
  }
  assert(new Set(lines).size === lines.length, 'no repeated lines');
  return `${lines.length} lines over ${Object.values(H.places).flatMap((p) => p.spots).length} spots`;
});

test('A pair keeps both members out of the count; granted leave keeps yours away', () =>
  quiet(() => {
    const { s, b, me, rng } = whipScenario(4);
    const other = Object.keys(s.parties).find((id) => id !== me.party && s.parties[id].chiefWhip);
    const m = caucusOf(s, me)[2];
    s.player.whipTrust[other] = 50;
    const r = ACTIONS.useTool(s, { tool: 'pair', mpId: m.id, billId: b.id, withParty: other });
    assert(r.ok, 'pair should be made: ' + JSON.stringify(r));
    const q = putQuestion(s, { billId: b.id, stage: 'second' }, rng);
    const d = runDivision(s, q);
    assert(!d.yeas.includes(m.id) && !d.nays.includes(m.id) && !d.yeas.includes(r.pair.b) && !d.nays.includes(r.pair.b), 'paired members counted');
    const l = caucusOf(s, me)[5];
    l.attendance = 100;
    ACTIONS.useTool(s, { tool: 'leave', mpId: l.id, billId: b.id, grant: true });
    assert(!intentions(s, b, createRng('x'))[l.id].present, 'member on leave should be away');
    return `${m.name.last} paired with ${s.mps[r.pair.b].name.last}; ${l.name.last} on leave`;
  }));

test('Leverage and a nomination threat each flip a lost member; a riding project and a QP slot move a leaner', () =>
  quiet(() => {
    const { s, b, me } = whipScenario(5);
    const [a, c, d, e] = caucusOf(s, me);
    const want = tools.wantedSide(s, b);
    const vote = (m) => intentions(s, b, { normal: () => 0, next: () => 0 })[m.id].vote;
    setScoreAt(s, a, b, -0.6);
    a.secrets = [{ id: 'x1', severity: 2, known: false }];
    reveal(s, a.id, 'secrets', 'dig');
    assert(vote(a) !== want, 'a should start lost');
    assert(ACTIONS.useTool(s, { tool: 'leverage', mpId: a.id, billId: b.id }).ok, 'leverage');
    assert(vote(a) === want, 'leverage should flip a');
    setScoreAt(s, c, b, -0.5);
    assert(ACTIONS.useTool(s, { tool: 'threatenNomination', mpId: c.id, billId: b.id }).ok, 'threat');
    assert(vote(c) === want, 'the threat should flip c');
    assert(c.floorCrossRisk >= tuning().tools.nominationCrossRisk, 'threat raises floor-cross risk');
    setScoreAt(s, d, b, tuning().vote.upper - 0.3);
    // Riding projects are a government whip's tool; make this the government's caucus for the check.
    s.house.government = me.party;
    assert(ACTIONS.useTool(s, { tool: 'ridingProject', mpId: d.id }).ok, 'project');
    assert(vote(d) === want, 'a project should carry d');
    setScoreAt(s, e, b, tuning().vote.upper - 0.1);
    assert(ACTIONS.useTool(s, { tool: 'qpSlot', mpId: e.id, give: true }).ok, 'qp');
    assert(vote(e) === want, 'a QP slot should carry e');
    return `${a.name.last} (leverage), ${c.name.last} (nomination), ${d.name.last} (project), ${e.name.last} (QP) all vote ${want}`;
  }));

test('Every favour, promise, pair and threat is in the ledger, from both sides', () =>
  quiet(() => {

test("The count board's prediction matches the division within two votes when every mark is current", () =>
  quiet(() => {
    const { s, b, rng } = whipScenario(3);
    for (const m of Object.values(s.mps)) m.attendance = 100;
    count.refreshMarks(s, b.id, { all: true });
    const pred = count.prediction(s, b.id);
    const q = putQuestion(s, { billId: b.id, stage: 'second' }, rng);
    const d = runDivision(s, q);
    const dy = Math.abs(pred.yeas - d.yeas.length);
    const dn = Math.abs(pred.nays - d.nays.length);
    assert(dy <= 2 && dn <= 2, `predicted ${pred.yeas}-${pred.nays}, division ${d.yeas.length}-${d.nays.length}`);
    assert(pred.firm + pred.leaning + pred.lost + pred.absent === pred.marked && pred.marked > 0, 'marks should cover the caucus');
    return `predicted ${pred.yeas}–${pred.nays} (need ${pred.needed}), division ${d.yeas.length}–${d.nays.length}; firm ${pred.firm} leaning ${pred.leaning} lost ${pred.lost} absent ${pred.absent}`;
  }));

test('Marks go stale, and a stale caucus falls out of the marked count', () => {
  const { s, b, me } = whipScenario(3);
  count.refreshMarks(s, b.id);
  const fresh = count.prediction(s, b.id).marked;
  s.date.absWeek += 4;
  const stale = count.markOf(s, caucusOf(s, me)[0].id, b.id);
  assert(fresh > 0 && stale?.stale, 'marks should be stale after four weeks');
  assert(count.prediction(s, b.id).marked === 0, 'stale marks still counted');
  return `${fresh} marked, then all stale after four weeks`;
});

test('Rival whips act every week: a poach, a leak and a pair test are all observable in a scenario', () =>
  quiet(() => {
    const { s, b, me, rng } = whipScenario(4, 'TEST-1');
    const other = Object.keys(s.parties).find((id) => id !== me.party && s.parties[id].chiefWhip);
    s.player.whipTrust[other] = 20;
    const m = caucusOf(s, me)[0];
    ACTIONS.useTool(s, { tool: 'pair', mpId: m.id, billId: b.id, withParty: other });
    s.player.whipFile.push({ bill: b.id, vote: 'nay', line: 'yea', day: 1 });
    const seen = new Set();
    for (let i = 0; i < 10; i++) for (const mv of rivals.rivalsWeek(s, rng)) seen.add(mv.kind);
    const kinds = s.ledger.filter((e) => e.kind === 'rival').map((e) => e.what.split(':')[0]);
    assert(kinds.some((k) => k === 'poach'), 'no poach');
    assert(kinds.some((k) => k === 'leak'), 'no leak');
    assert(kinds.some((k) => k === 'pairHonoured' || k === 'pairBroken'), 'no pair test');
    const styles = Object.values(s.parties).filter((p) => p.whipAI).map((p) => `${p.short}:${p.whipAI.style}`);
    assert(s.log.some((l) => l.kind === 'rival'), 'rival moves should reach the feed');
    return `moves ${[...seen].join(', ')} · whips ${styles.join(' ')}`;
  }));

test('A free vote releases the caucus; expulsion makes an independent and reseats the House', () => {
  const { s, b, me } = whipScenario(5);

// ---------- Stage 6: the career, Acts 1 and 2, and the riding ----------
section('Stage 6 · The career, Acts 1 and 2, and the riding');

const runHooks6 = (list, s, rng) => { for (const fn of list) { const p = fn(s, rng); if (p) return p; } return null; };

test('A new player starts in Act 1 in any party with a mentor, a cohort and a real dilemma vote', () => {
  const out = [];
  for (const party of ['p1', 'p2', 'p3', 'p4']) {
    const s = newGame({ seed: 'TEST-1', party, guided: true });

    assert(s.player.mentor && s.mps[s.player.mentor].party === party, 'mentor in own party');
    // Your cohort is everyone elected with you, across the House; a small party may have no other rookie.
    const cohort = Object.values(s.mps).filter((m) => m.cohort === me.cohort && m.id !== me.id);
    assert(cohort.length >= 1, 'a cohort');
    const b = s.bills[s.player.forceDilemma];
    assert(b && b.lines[party] === 'whipped', 'a whipped dilemma bill');
    assert(career.pickRival(s), 'a rival can be picked from the cohort');
    out.push(`${party}: mentor ${s.mps[s.player.mentor].name.last}, ${cohort.length} cohort-mates, rival ${s.mps[career.pickRival(s)].name.last}`);
  }
  return out.join(' · ');
});

test('The town hall placards carry the week\'s bill and local issue, filled in, one slogan per board', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2', guided: true });

test('Rebelling and toeing the line both change the whip\'s file, riding standing and standing with the whip', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2', guided: true });
  const b = s.bills[s.player.forceDilemma];
  const me = s.mps[s.player.mpId];
  const whip = s.parties[me.party].chiefWhip;
  const d = career.dilemmaFor(s, b, (st, m, bl) => intentions(st, bl, { normal: () => 0, next: () => 0 })[m.id] ? { parts: intentions(st, bl, { normal: () => 0, next: () => 0 })[m.id].parts } : { parts: {} }, tuning().pacing);
  assert(d, 'the first week is a dilemma');
  const T = tuning().player;
  const r0 = s.mps[whip].rapport;
  const s0 = s.player.ridingStanding;
  career.applyPlayerVote(s, b, 'rebel', d, T);
  const rebelFile = s.player.whipFile.length;
  const rebelWhip = s.mps[whip].rapport - r0;
  const rebelRiding = s.player.ridingStanding - s0;
  const s2 = newGame({ seed: 'TEST-1', party: 'p2', guided: true });
  const b2 = s2.bills[s2.player.forceDilemma];
  const w2 = s2.parties[s2.mps[s2.player.mpId].party].chiefWhip;
  const d2 = { ...d };
  const r1 = s2.mps[w2].rapport;
  const t0 = s2.player.ridingStanding;
  career.applyPlayerVote(s2, b2, 'line', d2, T);
  const lineWhip = s2.mps[w2].rapport - r1;
  const lineRiding = s2.player.ridingStanding - t0;
  assert(rebelFile === 1 && s2.player.whipFile.length === 0, 'only the rebel gets a file');
  assert(rebelWhip < 0 && lineWhip > 0, `whip rapport: rebel ${rebelWhip}, line ${lineWhip}`);
  assert(rebelRiding > lineRiding, `riding: rebel ${rebelRiding}, line ${lineRiding}`);
  return `rebel: file 1, whip ${rebelWhip}, riding ${rebelRiding > 0 ? '+' : ''}${rebelRiding} · line: file 0, whip +${lineWhip}, riding ${lineRiding}`;
});

test('Friday leave must be granted while the House sits; a cross whip keeps you in Ostrava', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2' });

test('A private member\'s bill can be drawn, chosen, asked for across the aisle, questioned by the whip, and voted on', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2', act: 2 });
  const rng = createRng('pmb');
  // Reach a sitting Monday so the bill can be scheduled against the calendar.
  for (let i = 0; i < 200 && !(pacing.isSittingWeek(s) && s.date.dayOfWeek === 1 && s.date.absWeek >= 1); i++) { const p = pacing.next(s); if (p) pacing.resolve(s, p.kind === 'division' ? 'line' : null); }
  const draw = pmb.drawLottery(s, rng);
  assert(draw.event === 'lottery' && draw.options.length === 3, 'three bills to choose from');
  const bill = pmb.chooseBill(s, rng, draw.options[0].id);
  assert(bill.sponsor === s.player.mpId && bill.status === 'active' && bill.nextVote != null, 'the bill is the player\'s and scheduled');
  const seen = [];
  let asked = 0;
  for (let i = 0; i < 6000; i++) {
    const p = pacing.next(s);
    if (!p) continue;
    if (p.kind === 'career') {
      seen.push(p.event);
      if (p.event === 'crossAisle' && asked < 2 && p.options[0].id !== 'done') { asked++; pacing.resolve(s, p.options[0].id); continue; }
      pacing.resolve(s, p.event === 'crossAisle' ? 'done' : p.event === 'whipQuestion' ? 'explain' : null);
      continue;
    }
    if (p.kind === 'division') { pacing.resolve(s, p.reason === 'ownBill' ? 'yea' : 'line'); continue; }
    if (p.kind === 'dissolved') break;
    pacing.resolve(s, null);
    if (s.player.pmb?.settled) break;
  }
  assert(seen.includes('crossAisle'), 'the cross-aisle asks: ' + seen.join(','));
  assert(seen.includes('whipQuestion'), 'the whip asks why');
  assert(s.player.pmb.settled, 'the bill came to a vote');
  const d = Object.values(s.divisions).find((x) => x.billId === bill.id) || null;
  const line = s.log.find((l) => /passed second reading|was defeated/.test(l.text));
  assert(line, 'a result was logged');
  return `${bill.title}: asked ${asked} across the aisle, whip questioned; ${line.text}${d ? ` (${d.yeas.length}–${d.nays.length})` : ''}`;
});

test('Act 1 graduates to Act 2 by being noticed, with a reputation and a rival', () => {

test('Act 2 ends with a vacancy contest against the rival: win it and you are an assistant whip, lose it and you choose what next', () => {
  const setup = (seed) => {
    const s = newGame({ seed, party: 'p2', act: 2 });
    s.player.actStart = 0;
    s.date.absWeek = tuning().career.act2MinWeeks + 1;
    s.player.vacancyDue = s.date.absWeek;
    s.player.rival = career.pickRival(s);
    return s;
  };
  const w = setup('TEST-1');
  w.mps[w.parties.p2.chiefWhip].rapport = 100;
  w.player.actProgress.noticed = 40;
  w.mps[w.player.rival].loyalty = 0;
  w.mps[w.player.rival].ambition = 0;
  const v = runHooks6(pacing.hooks.weekend, w, createRng('v'));
  assert(v?.event === 'vacancy' && v.options.length === 3, 'a vacancy opens');
  w.flow.pending = v;
  pacing.resolve(w, 'askMentor');
  const after = pacing.next(w);
  assert(after?.event === 'act3' && w.player.act === 3 && w.mps[w.player.mpId].caucusRole === 'assistantWhip' && w.parties.p2.assistantWhips.includes(w.player.mpId), 'won the chair');
  const l = setup('TEST-1');
  l.mps[l.parties.p2.chiefWhip].rapport = -80;
  l.player.actProgress.rebellions = 6;
  l.mps[l.player.rival].loyalty = 100;
  l.mps[l.player.rival].ambition = 100;
  const v2 = runHooks6(pacing.hooks.weekend, l, createRng('v'));
  l.flow.pending = v2;
  pacing.resolve(l, 'letItRun');
  const lost = pacing.next(l);
  assert(lost?.event === 'lost' && l.player.act === 2 && l.mps[l.player.rival].caucusRole === 'assistantWhip', 'the rival got it');
  pacing.resolve(l, 'committeeChair');
  assert(l.mps[l.player.mpId].caucusRole === 'committeeChair' && l.player.vacancyDue > l.date.absWeek, 'took the chair and waits for the next vacancy');

test('A life event asks you to show up for someone, and showing up is remembered', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2' });
  const me = s.mps[s.player.mpId];
  const m = Object.values(s.mps).find((x) => x.party === me.party && x.id !== me.id);
  const e = lifeEvents.newLifeEvent(s, createRng('life'), m);
  assert(e && m.lifeEvents.includes(e) && e.text.includes(m.name.first), 'event created with text');
  const r0 = m.rapport;
  s.flow.pending = { kind: 'career', event: 'lifeEvent', mpId: m.id, eventId: e.id, text: e.text, options: [] };
  pacing.resolve(s, 'showUp');

});

// ---------- Stage 7: the career, Acts 3 to 5, and the caucus room ----------
section('Stage 7 · Acts 3 to 5, endings, the caucus room');

// Every hook runs and every stop is queued, so look for the one the test is about.
const hookEvent = (list, s, rng, event) => list.map((fn) => fn(s, rng)).find((p) => p && (p.event === event || p.kind === event)) || null;

function atAct(act, seed = 'TEST-1') {
  const s = newGame({ seed, party: 'p2', act });
  s.player.actStart = 0;
  s.player.filesShared = true;
  if (act >= 3) s.parties.p2.assistantWhips.push(s.player.mpId), (s.mps[s.player.mpId].caucusRole = 'assistantWhip');
  if (act >= 4) (s.parties.p2.deputyWhip = s.player.mpId), (s.mps[s.player.mpId].caucusRole = 'deputyWhip');
  if (act >= 5) (s.parties.p2.chiefWhip = s.player.mpId), (s.mps[s.player.mpId].caucusRole = 'chiefWhip');
  return s;
}

test('Act 3: the row you answer for, leaning on a friend, and both ways out (deputy whip or the backbench)', () => {
  const R = tuning().ranks;
  const { s, b, me } = whipScenario(3);
  s.player.actStart = 0;
  s.player.filesShared = true;
  const row = ranks.rowOf(s);
  assert(row.length >= 5 && row.every((m) => m.party === me.party), 'a row of your own party');
  // A friend in the row whose riding hates the bill: the set piece fires on Monday.
  const friend = row[0];
  friend.cohort = me.cohort;
  b.ridingEffects[friend.riding.type] = b.positions[me.party] === 'yea' ? -1 : 1;
  s.date.dayOfWeek = 1;
  const stop = hookEvent(pacing.hooks.morning, s, createRng('m'), 'leanOnFriend');
  assert(stop?.event === 'leanOnFriend' && stop.mpId === friend.id && stop.options.length === 3, 'the lean-on-a-friend moment');
  s.flow.pending = stop;
  const r0 = friend.rapport;
  pacing.resolve(s, 'hard');
  assert((s.nudges[friend.id][b.id] || 0) !== 0 && friend.rapport === r0 + R.leanHardRapport, 'leaning hard moves the vote and costs the friendship');
  // Graduation: enough carried votes over enough weeks.
  s.date.absWeek = R.act3MinWeeks;
  s.player.actProgress.rowVotesCarried = R.rowCarriesForAct4;
  const up = hookEvent(pacing.hooks.weekend, s, createRng('w'), 'act4');
  assert(up?.event === 'act4' && s.player.act === 4 && s.parties.p2.deputyWhip === s.player.mpId && me.caucusRole === 'deputyWhip', 'promoted to deputy whip');
  // Failure: the row went its own way on a vote that mattered.
  const { s: f } = whipScenario(3);
  f.player.actStart = 0;
  f.player.filesShared = true;
  f.date.absWeek = 4;
  f.player.rowStats = { carried: 0, rebels: 4, failures: 1 };
  const down = hookEvent(pacing.hooks.weekend, f, createRng('w'), 'demoted');
  assert(down?.event === 'demoted' && f.player.act === 2 && f.mps[f.player.mpId].caucusRole === 'backbencher' && ['soft', 'bully'].includes(f.player.reputation), 'demoted as soft or a bully');
  return `row of ${row.length}; leaned on ${friend.name.last}; up to Act 4, or down as ${f.player.reputation}`;
});

test('Act 4: the count is yours (a wrong count costs the job), the pair before a confidence vote, the temptation, the chief whip\'s chair', () => {
  const R = tuning().ranks;
  const { s, b, me } = whipScenario(4);
  s.parties.p2.deputyWhip = s.player.mpId;
  me.caucusRole = 'deputyWhip';
  s.player.actStart = 0;
  s.player.filesShared = true;
  b.confidence = true;
  b.nextVote = s.date.absWeek * 5 + 3;
  s.date.dayOfWeek = 1;
  const stops = [];
  for (const h of pacing.hooks.morning) { const p = h(s, createRng('m')); if (p) stops.push(p); }
  const pair = stops.find((p) => p.event === 'confidencePair');
  assert(pair && pair.options.length === 2, 'the opposite number offers a pair before the confidence vote');
  s.flow.pending = pair;
  const n0 = s.pairs.length;
  pacing.resolve(s, 'accept');
  assert(s.pairs.length === n0 + 1 && s.pairs.at(-1).a === pair.mpId && s.pairs.at(-1).bill === b.id, 'the pair is on the book');
  assert(s.player.predicted?.[b.id] !== undefined, 'the Monday count is recorded against you');
  // The temptation, declined at a cost; then the chair when the caucus wants you.
  s.date.absWeek = R.temptationWeek;
  const temp = hookEvent(pacing.hooks.weekend, s, createRng('w'), 'temptation');
  assert(temp?.event === 'temptation', 'the parliamentary secretary offer');
  s.flow.pending = temp;
  const lt = s.player.leaderTrust;
  pacing.resolve(s, 'decline');
  assert(!s.ending && s.player.leaderTrust === Math.max(0, lt + R.temptationTrust), 'declining costs a little trust');
  s.date.absWeek = R.act4MinWeeks;
  s.player.caucusSupport = R.caucusSupportForChief;
  s.player.forceChiefVacancy = true;
  const chair = hookEvent(pacing.hooks.weekend, s, createRng('w'), 'act5');
  assert(chair?.event === 'act5' && s.player.act === 5 && s.parties.p2.chiefWhip === s.player.mpId, 'appointed Chief Whip');
  // Or the temptation taken: an ending with a record.
  const e = atAct(4);
  e.flow.pending = { kind: 'career', event: 'temptation', options: [] };
  pacing.resolve(e, 'accept');
  assert(e.ending?.endingKind === 'exit' && e.ending.record.weeks === e.date.absWeek && pacing.next(e)?.kind === 'ending', 'the exit ending');
  // Or a wrong count: the deputy who called a lost confidence vote safe is moved sideways.
  const w = atAct(4);
  w.player.wrongCounts = R.wrongCountsForFailure;
  w.date.absWeek = 3;
  const down = hookEvent(pacing.hooks.weekend, w, createRng('w'), 'demoted');
  assert(down?.event === 'demoted' && w.player.act === 3 && w.mps[w.player.mpId].caucusRole === 'assistantWhip', 'back to assistant whip');
  return `paired ${s.mps[pair.mpId].name.last}; declined the car; Chief Whip at week ${R.act4MinWeeks}; exit and wrong-count both reachable`;
});

test('Act 5: setting the line with the leader (whip it, free vote, confidence), and the fall', () => {
  const { s, b, me } = whipScenario(5);
  s.parties.p2.chiefWhip = s.player.mpId;
  me.caucusRole = 'chiefWhip';
  s.player.filesShared = true;
  s.house.government = me.party;
  b.kind = 'government';
  s.date.dayOfWeek = 1;
  const stop = pacing.hooks.morning.map((h) => h(s, createRng('m'))).find((p) => p?.event === 'setLine');
  assert(stop && stop.options.find((o) => o.id === 'confidence').enabled, 'Monday: set the line, confidence on the table');
  s.flow.pending = stop;
  pacing.resolve(s, 'free');
  assert(b.lines[me.party] === 'free', 'a free vote');
  s.flow.pending = { ...stop };
  pacing.resolve(s, 'confidence');
  assert(b.confidence && b.lines[me.party] === 'whipped', 'made a matter of confidence');
  // The fall: the government loses on your count.
  s.house.fallen = { billId: b.id };
  s.flow.day = { results: [] };
  const fall = hookEvent(pacing.hooks.fallout, s, createRng('f'), 'fall');
  assert(fall?.event === 'fall' && fall.options.length === 2, 'the leader asks for your resignation');
  s.flow.pending = fall;
  pacing.resolve(s, 'retire');
  assert(s.ending?.endingKind === 'fall' && s.ending.record.rank === 'Chief Whip', 'the fall ending keeps the rank you reached');
  return `${b.title}: free, then confidence; fell, and the record says ${s.ending.record.rank}`;
});

test('Caucus: a revolt can be called, you pick a side, and it resolves when the room empties', () => {
  const s = atAct(5);
  s.player.caucusSupport = 60;
  s.forceRevolt = true;
  const rng = createRng('revolt');
  const c = caucusSim.startCaucus(s, rng);
  assert(c?.revolt && c.revolt.target === 'leader' && c.revolt.text.length > 40, 'a revolt against the leader');
  const leader0 = s.parties.p2.leader;
  c.revolt.support = c.revolt.size;
  assert(ACTIONS.caucusRevolt(s, { choice: 'join' })?.ok && c.revolt.choice === 'join', 'joined');
  caucusSim.endCaucus(s);
  assert(s.parties.p2.leader !== leader0 && s.mps[s.parties.p2.leader].caucusRole === 'leader' && s.mps[leader0].caucusRole === 'backbencher', 'the leader fell and someone took over');
  assert(s.player.leaderTrust === tuning().ranks.revoltLeaderTrustJoin, 'the new leader remembers who stood up');
  // Against the whip, with the room against you: the caucus turns you out.
  const w = atAct(5);
  w.player.caucusSupport = 10;
  w.forceRevolt = true;
  const cw = caucusSim.startCaucus(w, createRng('r2'));
  assert(cw.revolt.target === 'whip', 'a revolt against the whip');
  cw.revolt.support = cw.revolt.size;
  caucusSim.endCaucus(w);
  const next = w.flow.queued[0];
  assert(next?.event === 'revolted', 'turned out: the choice to stay or go');
  w.flow.pending = next;
  pacing.resolve(w, 'stay');
  assert(w.player.act === 2 && w.mps[w.player.mpId].caucusRole === 'backbencher', 'back to the backbench');
  return `${s.mps[leader0].name.last} out, ${s.mps[s.parties.p2.leader].name.last} in; and the whip's revolt lands you on the backbench`;
});

test('Cabinet offers can be declined at no cost and keep coming; accepting ends the career with a record', () => {
  const s = atAct(5);
  s.player.forceCabinetOffer = true;
  s.date.absWeek = 20;
  const offer = hookEvent(pacing.hooks.weekend, s, createRng('c'), 'cabinetOffer');
  assert(offer?.event === 'cabinetOffer' && offer.portfolio, 'an offer with a portfolio');
  s.flow.pending = offer;
  const lt = s.player.leaderTrust;
  pacing.resolve(s, 'decline');
  assert(!s.ending && s.player.leaderTrust === lt && s.player.cabinetOffers === 1, 'declined, no cost');
  s.player.forceCabinetOffer = true;
  const again = hookEvent(pacing.hooks.weekend, s, createRng('c'), 'cabinetOffer');
  assert(again?.event === 'cabinetOffer' && again.portfolio !== offer.portfolio, 'they ask again with another portfolio');
  s.flow.pending = again;
  pacing.resolve(s, 'accept');
  assert(s.ending?.endingKind === 'cabinet' && s.ending.portfolio === again.portfolio && s.ending.epilogue.length > 20, 'the cabinet ending');
  const p = pacing.next(s);
  assert(p.kind === 'ending' && p.record.votesWon >= 0 && pacing.advance(s)?.kind === 'ending', 'the ending is a stop nothing moves past');
  return `${offer.portfolio} declined, ${again.portfolio} accepted`;
});

test('Crossing the floor starts Act 1 again in the new caucus with your reputation, and burns the old ledger', () => {
  const R = tuning().ranks;
  const s = atAct(3);
  const me = s.mps[s.player.mpId];
  s.player.reputation = 'usefulTrouble';
  const other = Object.values(s.mps).find((m) => m.party === me.party && m.id !== me.id);
  s.ledger.push({ id: 'x1', kind: 'promise', from: me.id, to: other.id, what: 'favor', settled: false, week: 0 });
  const r0 = other.rapport;
  const standing0 = s.player.ridingStanding;
  assert(!record.crossFloor(s, me.party).ok, 'cannot cross to your own party');
  const to = Object.values(s.parties).find((q) => q.id !== me.party && q.id !== 'ind');
  const seats0 = to.seats;
  assert(record.crossFloor(s, to.id).ok, 'crossed');
  assert(me.party === to.id && me.seatId && s.seats[me.seatId].mpId === me.id && to.seats === seats0 + 1, 'reseated with the new caucus');
  assert(s.player.act === 1 && me.caucusRole === 'backbencher' && s.player.highestAct === 3 && s.player.reputation === 'usefulTrouble', 'Act 1 again, reputation in tow, the old rank remembered');
  assert(s.ledger[0].settled && s.ledger[0].kept === false && other.rapport === Math.max(-100, r0 + R.crossFloorRapport) && s.player.ridingStanding === Math.max(0, standing0 + R.crossFloorStanding), 'the old caucus: ledger burned, rapport gone, standing hit');

// ---------- Stage 8: confidence, consequences and elections ----------
section('Stage 8 · Confidence, consequences and elections');

function playToDissolution(s, rng) {
  for (let i = 0; i < 400000; i++) {
    const p = s.flow.pending;
    if (p?.kind === 'dissolved') return p;
    botAct(s, rng);
  }
  return null;
}

test('A minority government falls on a lost confidence vote and an election is called; early in a Parliament the opposition may take over instead', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p2' });
  const me = s.mps[s.player.mpId];
  s.house.minority = true;
  s.date.absWeek = tuning().confidence.handoverWeeks + 5;
  s.house.fallen = { day: 1, billId: null, divisionId: null };
  const p = pacing.next(s);
  assert(p?.kind === 'dissolved' && p.reason === 'fallen', 'the writ drops');
  pacing.resolve(s, 'canvass');
  const night = pacing.next(s);
  assert(night?.kind === 'election' && night.phase === 'result' && night.seats.length === Object.keys(s.parties).length, 'election night');
  assert(night.player.result === 'held' && s.house.parliament === 25 && s.date.absWeek === 0, 'held the seat; the 25th Parliament opens');
  assert(Object.keys(s.mps).length === 120 && Object.values(s.parties).reduce((n, q) => n + q.seats, 0) + s.house.independents === 120, 'a full House');
  pacing.resolve(s, null);
  for (let i = 0; i < 60 && s.date.absWeek < 1; i++) {
    const q = pacing.skip(s);
    if (q && q.kind !== 'dissolved') pacing.resolve(s, q.kind === 'division' ? 'line' : null);
  }
  assert(s.date.absWeek >= 1 && s.date.parliament === 25 && Object.values(s.bills).length > 0, 'business resumes');
  // The handover: a government that falls in its first months hands over to the opposition, no election.
  const h = newGame({ seed: 'TEST-1', party: 'p2' });
  const gov0 = h.house.government;
  h.date.absWeek = 4;
  h.house.fallen = { day: 1, billId: null, divisionId: null };
  const stop = pacing.next(h);
  assert(stop?.kind === 'election' && stop.phase === 'handover' && h.house.government !== gov0 && h.parties[gov0].role === 'opposition' && h.parties[h.house.government].role === 'government', 'the opposition forms a government');
  assert(h.house.parliament === 24 && !h.house.fallen && Object.values(h.mps).every((m) => m.caucusRole === 'speaker' || m.seatId), 'same Parliament, reseated');
  return `${night.governmentName} ${night.minority ? 'minority' : 'majority'} after the fall; ${h.parties[h.house.government].short} took over from ${h.parties[gov0].short} in week 4 (${me.name.last} still seated)`;
});

test('A full four-year Parliament and its election play through with the bot, no errors; the riding can be lost or the nomination', () => {
  const s = newGame({ seed: 'TEST-3', party: 'p1' });
  const rng = createRng('bot8');
  const t0 = performance.now();
  const writ = playToDissolution(s, rng);
  assert(writ?.kind === 'dissolved', 'reached the writ');
  const weeks = s.date.absWeek;
  pacing.resolve(s, 'tour');
  const night = pacing.next(s);
  assert(night?.kind === 'election', 'election night after four years');
  const held = night.player.result === 'held';
  pacing.resolve(s, null);
  if (held) {
    assert(s.house.parliament === 25 && s.player.record.parliaments === 2, 'second Parliament on the record');
    for (let i = 0; i < 3000; i++) { const p = s.flow.pending; if (p) { if (p.kind === 'ending') break; botAct(s, rng); } else pacing.next(s); if (s.date.absWeek >= 2) break; }
    assert(s.date.absWeek >= 2, 'the new Parliament sits');
  } else assert(['defeated', 'nomination'].includes(s.ending?.endingKind), 'the defeated or deselected ending: ' + s.ending?.endingKind);
  // Losing the riding: a member the whole country has turned on.
  const l = newGame({ seed: 'TEST-1', party: 'p2' });
  const me = l.mps[l.player.mpId];
  me.margin = 1;
  me.scandal = 100;
  l.player.ridingStanding = 5;
  for (const id of Object.keys(l.polling)) l.polling[id] = id === me.party ? 0.5 : 30;
  l.flow.pending = { kind: 'dissolved', important: true, needsChoice: true, reason: 'fixedDate' };
  pacing.resolve(l, 'rest');
  const ln = pacing.next(l);
  assert(ln?.kind === 'election' && ln.player.result === 'lost', 'lost the riding: ' + ln?.player?.result);
  pacing.resolve(l, null);
  assert(l.ending?.endingKind === 'defeated' && pacing.next(l)?.kind === 'ending', 'the record closes');
  const n = newGame({ seed: 'TEST-1', party: 'p2' });
  n.player.nominationThreat = 100;
  n.player.ridingStanding = 20;
  n.flow.pending = { kind: 'dissolved', important: true, needsChoice: true, reason: 'fixedDate' };
  pacing.resolve(n, 'rest');
  const nn = pacing.next(n);
  assert(nn.player.result === 'deselected', 'deselected before the writ');
  pacing.resolve(n, null);
  assert(n.ending?.endingKind === 'nomination', 'the nomination ending');
  return `${weeks} weeks, ${Math.round(performance.now() - t0)} ms; ${held ? 'held' : 'lost'} ${night.player.riding} by ${night.player.margin}; the defeat and the deselection both reachable`;
});

test('After an election the blocks, roles and cohorts are new and the ledger carries over', () => {
  const s = newGame({ seed: 'TEST-2', party: 'p2' });
  const me = s.mps[s.player.mpId];
  const before = Object.fromEntries(Object.values(s.parties).map((q) => [q.id, q.seats]));
  const other = Object.values(s.mps).find((m) => m.party === me.party && m.id !== me.id && m.caucusRole === 'backbencher');
  s.ledger.push({ id: 'L1', kind: 'favor', from: other.id, to: me.id, what: 'speakingTime', settled: false, week: 3 });
  s.player.act = 3;
  s.parties.p2.assistantWhips.push(me.id);
  me.caucusRole = 'assistantWhip';
  // The third party surges. The player sits on a safe margin so the test is about the House, not their seat.
  me.margin = 30;
  for (const id of Object.keys(s.polling)) if (id !== me.party) s.polling[id] = id === 'p3' ? 45 : 12;
  s.flow.pending = { kind: 'dissolved', important: true, needsChoice: true, reason: 'fixedDate' };
  pacing.resolve(s, 'canvass');
  const night = pacing.next(s);
  assert(night.player.result === 'held', 'held (margin ' + night.player.margin + ')');
  const after = Object.fromEntries(Object.values(s.parties).map((q) => [q.id, q.seats]));
  assert(after.p3 > before.p3 && s.house.government === 'p3' && s.parties.p3.role === 'government', 'the poll leader forms the government: ' + JSON.stringify(after));
  const seatCount = Object.values(s.mps).filter((m) => m.seatId).length;
  assert(seatCount === 119 && s.mps[s.house.speaker]?.caucusRole === 'speaker', 'reseated with a Speaker');
  for (const q of Object.values(s.parties)) if (q.seats >= 2) assert(q.leader && s.mps[q.leader]?.party === q.id && q.chiefWhip && s.mps[q.chiefWhip]?.party === q.id, `${q.short} has a leader and a whip`);
  const rookies = Object.values(s.mps).filter((m) => m.cohort === 25);
  assert(rookies.length === night.newcomers && rookies.every((m) => m.tenure === 0) && night.gone === night.newcomers, 'a new cohort of ' + rookies.length);
  assert(Object.values(s.mps).filter((m) => m.cohort < 25).every((m) => m.tenure >= 4), 'survivors are four years older in the House');
  assert(me.caucusRole === 'assistantWhip' && s.parties.p2.assistantWhips.includes(me.id) && s.player.act === 3, 'the player keeps their rank');
  assert(s.ledger.find((e) => e.id === 'L1'), 'the ledger carried over');
  const goneIds = Object.keys(s.alumni);
  assert(goneIds.length === night.gone && goneIds.every((id) => !s.mps[id]), 'the departed are remembered as alumni');
  assert(Object.values(s.cliques).every((q) => q.members.every((id) => s.mps[id])), 'cliques rebuilt around the living');
  return `${night.governmentName} ${after.p3} seats; ${rookies.length} rookies; ${night.cohortLost} of the cohort lost; ledger ${s.ledger.length} entries`;
});

test('Headlines lead with the day\'s biggest story and move polling, standing and the pressure meter', () => {
  const { s, b, me } = whipScenario(3);
  s.house.government = me.party;
  b.confidence = true;
  b.kind = 'government';
  const rebels = Object.values(s.mps).filter((m) => m.party === me.party && m.id !== me.id).slice(0, 4).map((m) => m.id);
  s.divisions.d1 = { id: 'd1', recorded: true, billId: b.id, carried: false, yeas: [me.id], nays: rebels, paired: [], stage: 'second', day: 3 };
  s.flow.day = { matters: true, results: ['d1'] };
  const poll0 = s.polling[me.party];
  const press0 = s.log.filter((l) => l.kind === 'press').length;
  // Early in the Parliament the gallery knows the opposition will be sent for; later, that an election follows.
  s.date.absWeek = 2;
  for (const fn of pacing.hooks.fallout) fn(s, createRng('press'));
  assert(s.press.at(-1).event === 'confidenceLostHandover' && !/\{\w+\}/.test(s.press.at(-1).text), 'the handover headline: ' + s.press.at(-1)?.text);
  s.date.absWeek = tuning().confidence.handoverWeeks;
  for (const fn of pacing.hooks.fallout) fn(s, createRng('press'));
  const press = s.log.filter((l) => l.kind === 'press');
  assert(press.length === press0 + 2 && s.press.at(-1).event === 'confidenceLost' && !/\{\w+\}/.test(press.at(-1).text), 'one headline, the government falling: ' + press.at(-1)?.text);
  assert(s.polling[me.party] < poll0, 'polling fell');
  assert(s.pressure >= tuning().confidence.pressureConfidenceLost + 20, 'the leader\'s office noticed: pressure ' + s.pressure);
  // Replacing the whip when the meter tops out.
  const r = whipScenario(3).s;
  r.player.actStart = 0;
  r.parties.p2.assistantWhips.push(r.player.mpId);
  r.mps[r.player.mpId].caucusRole = 'assistantWhip';
  r.pressure = 100;
  const stop = hookEvent(pacing.hooks.weekend, r, createRng('w'), 'replaced');
  assert(stop?.event === 'replaced' && r.player.act === 2 && r.mps[r.player.mpId].caucusRole === 'backbencher' && r.pressure < 100, 'moved out of the whip\'s office');
  return `${press.at(-1).text} · polling ${poll0} → ${s.polling[me.party]} · pressure ${s.pressure}`;
});

test('A minority government signs confidence and supply, the partner is whipped YEA on confidence votes, and either side can break it', () => {
  const { s, b, me } = whipScenario(2);
  s.house.government = me.party;
  s.house.minority = true;
  s.parties[me.party].role = 'government';
  b.confidence = true;
  b.kind = 'government';
  for (const id of Object.keys(s.polling)) s.polling[id] = 20;
  const a = confidence.signAgreement(s, createRng('cs'));
  assert(a && s.parties[a.with].agreements.includes(a) && confidence.activeAgreement(s) === a, 'signed with ' + a?.with);
  const partner = a.with;
  b.positions[partner] = 'nay';
  b.lines[partner] = 'whipped';
  s.date.dayOfWeek = 1;
  for (const fn of pacing.hooks.morning) fn(s, createRng('never-breaks-' + 'x'));
  assert(b.positions[partner] === 'yea' && b.lines[partner] === 'whipped', 'the partner comes home on confidence');
  confidence.breakAgreement(s, a, 'partner');
  assert(a.broken && !confidence.activeAgreement(s) && /walks away/.test(s.log.at(-1).text), 'broken and reported');
  return `${s.parties[partner].name} for ${a.category}, then walked`;
});

test('Three scenarios start correctly: the right act, role, week, bill and count', () => {
  const notes = [];
  for (const sc of scenarioList()) {
    const s = scenarioGame(sc.id);
    const me = s.mps[s.player.mpId];
    assert(s.mode.kind === 'scenario' && s.mode.id === sc.id && s.mode.brief, `${sc.id} has a brief`);
    assert(s.date.absWeek === sc.week && s.date.dayOfWeek === (sc.day || 1), `${sc.id} opens on its day`);
    assert(s.player.act === sc.act && (!sc.role || me.caucusRole === sc.role), `${sc.id} rank`);
    const bill = s.bills[s.mode.billId];
    assert(bill && bill.nextVote === sc.week * 5 + 3, `${sc.id} bill is Thursday`);
    assert(s.flow.forceWatch, `${sc.id} stops every morning`);
    if (sc.minority) assert(s.house.minority, `${sc.id} is a minority`);
    if (sc.short) assert(count.prediction(s, bill.id).short === sc.short, `${sc.id} is ${sc.short} short`);
    if (sc.setup === 'revolt') assert(s.forceRevolt, `${sc.id} revolt is loaded`);
    const p = pacing.advance(s);
    assert(p?.kind === 'morning' && s.date.dayOfWeek === (sc.day || 1), `${sc.id} first stop is the morning`);
    notes.push(`${sc.id}: ${bill.title}`);
  }
  let threw = false;
  try { scenarioGame('nope'); } catch (e) { threw = /Unknown scenario/.test(e.message); }

  return notes.join(' · ');
});

// Play a fresh guided game forward to its first Question Period stop.
function toQuestionPeriod(party) {
  const s = newGame({ seed: 'TEST-1', party, guided: true });
  let p = pacing.next(s);
  for (let i = 0; i < 300 && p?.kind !== 'questionPeriod'; i++) {
    pacing.resolve(s, p?.kind === 'division' ? 'line' : null);
    p = pacing.next(s);
  }
  return s;
}

test('The first question comes on the guided week\'s Tuesday, before the day\'s votes, to a sitting minister', () => {
  const out = [];
  for (const party of ['p1', 'p2', 'p3']) {
    const s = toQuestionPeriod(party);

    assert(p?.kind === 'questionPeriod' && p.needsChoice, `${party}: a Question Period stop`);

    assert(s.flow.day.results.length === 0, `${party}: before any division`);

test('Each framing moves the whip, the riding and being noticed the tuned way, and the day carries on', () => {
  const out = [];
  for (const party of ['p1', 'p2']) {
    const base = toQuestionPeriod(party);
    const me = base.mps[base.player.mpId];
    const whip = base.parties[me.party].chiefWhip;
    const E = tuning().questionPeriod.effects[base.questionPeriod.side];
    for (const f of qp.FRAMINGS) {
      const s = structuredClone(base);
      const r0 = s.mps[whip].rapport;
      const n0 = s.player.actProgress.noticed;
      const rs0 = s.player.ridingStanding;
      ACTIONS.qpAsk(s, { framing: f });
      const q = s.questionPeriod;
      assert(q.phase === 'answer' && q.framing === f, `${party} ${f}: answered`);
      const expect = { soft: ['lob'], pointed: ['hit', 'parried'], offScript: ['home'] }[f];
      assert(expect.includes(q.outcome), `${party} ${f}: outcome ${q.outcome}`);
      const e = E[q.outcome];
      assert(Math.sign(s.mps[whip].rapport - r0) === Math.sign(e.whip), `${party} ${f}: whip moved ${s.mps[whip].rapport - r0} for ${e.whip}`);
      assert(s.player.actProgress.noticed - n0 === e.noticed, `${party} ${f}: noticed`);
      assert(s.player.ridingStanding - rs0 === e.riding, `${party} ${f}: riding ${s.player.ridingStanding - rs0} for ${e.riding}`);
      assert(q.answer && q.benches && q.gallery && ![q.answer, q.benches, q.gallery].some((x) => /[{}]/.test(x)), `${party} ${f}: answer, benches and gallery filled`);
      assert(q.effects && (q.effects.headline === null || s.press.at(-1).text === q.effects.headline), `${party} ${f}: a headline, if any, is in the press`);
      pacing.resolve(s);
      assert(!s.questionPeriod && !s.flow.pending && s.player.lastQp != null, `${party} ${f}: cleared`);
      const nxt = pacing.advance(s);
      assert(nxt && nxt.kind !== 'questionPeriod', `${party} ${f}: the day goes on to ${nxt?.kind}`);
      out.push(`${party}/${f}: ${q.outcome}`);
    }
  }
  return out.join(' · ');
});

section('Round two · The front page');

test('The weekend paper: a lead with a deck, the polls on the record, a quiet week still makes a page, every deck fills', () => {
  // A guided first week ends on a front page whose lead is filled in and whose polls have their first point.
  const s = newGame({ seed: 'TEST-1', party: 'p1', guided: true });
  const rng = createRng('front');
  for (let i = 0; i < 4000 && s.flow.pending?.kind !== 'weekSummary'; i++) botAct(s, rng);
  const sum = s.flow.pending?.summary;
  assert(sum, 'reached the first weekend');
  const lead = sum.press[0];
  assert(lead && lead.text && lead.paper && lead.event, 'the first week has a lead story');
  assert(!/[{}]/.test(lead.text + (lead.deck || '')), 'the lead is filled in: ' + lead.text);
  assert(sum.press.every((e, i) => i === 0 || media.FRONT_PRIORITY.indexOf(e.event) >= media.FRONT_PRIORITY.indexOf(sum.press[i - 1].event)), 'stories run in front-page order');
  assert(s.pollHistory.length === 1 && Object.keys(s.pollHistory[0].polling).join() === Object.keys(s.polling).join(), 'the polls go on the record at the weekend');
  assert(sum.polling && typeof sum.polling[s.house.government] === 'number', 'the summary carries the polls');
  // Weeks later the chart has a line to draw.
  for (let i = 0; i < 4000 && s.date.absWeek < 3; i++) botAct(s, rng);
  assert(s.pollHistory.length >= 2, 'poll history grows week by week: ' + s.pollHistory.length);
  // A week with no press at all still gets a lead, chosen without touching the RNG.
  const q = newGame({ seed: 'TEST-2', party: 'p2' });
  q.press = [];
  const before = JSON.stringify(q.rng);
  for (const fn of pacing.hooks.weekend) fn(q, createRng('unused'));
  const quiet = q.flow.week.press[0];
  assert(quiet?.quiet && quiet.text && quiet.deck && quiet.paper && !/[{}]/.test(quiet.text + quiet.deck), 'a quiet week has a filled lead');
  assert(JSON.stringify(q.rng) === before, 'the quiet lead does not draw on the RNG');
  // Every deck, byline and caption uses only the keys a headline can fill.
  const H = data().headlines;
  const keys = new Set(['name', 'riding', 'party', 'leader', 'paper', 'bill', 'yeas', 'nays', 'count', 'opposition', 'minister', 'issue']);
  let decks = 0;
  for (const [event, list] of Object.entries(H.decks)) {
    assert(H.headlines.some((h) => h.event === event), 'decks for a known event: ' + event);
    for (const d of list) {
      decks++;
      for (const k of d.match(/\{(\w+)\}/g) || []) assert(keys.has(k.slice(1, -1)), `deck key ${k} in: ${d}`);
    }
  }
  for (const c of [...H.bylines, ...H.captions]) for (const k of c.match(/\{(\w+)\}/g) || []) assert(['name', 'riding'].includes(k.slice(1, -1)), 'caption key ' + k);
  // The player's stories carry their photograph; the House's do not.
  const r2 = createRng('you');
  media.headline(s, r2, 'townHall', { bill: 'An Act' });
  media.headline(s, r2, 'billPassed', { bill: 'An Act', yeas: 60, nays: 50 });
  const [th, bp] = s.press.slice(-2);
  assert(th.you === true && bp.you === false, 'the photo flag follows the player');
  assert(th.deck && !/[{}]/.test(th.deck), 'a deck comes with the headline');
  return `${lead.paper}: ${lead.text} · ${decks} decks`;
});

section('Round two · Seasons');

test('The year runs September to June: forty weeks, ten months of four, four seasons on the tuned weeks', () => {
  const C = tuning().calendar;
  assert(C.months.length * C.weeksPerMonth === C.weeksPerYear, 'months do not fill the year');
  const at = (week, dayOfWeek = 1) => calendarOf({ week, year: 1, dayOfWeek });
  const checks = [[1, 'September', 1, 'autumn'], [12, 'November', 26, 'autumn', 5], [13, 'December', 1, 'winter'], [24, 'February', 26, 'winter', 5], [25, 'March', 1, 'spring'], [36, 'May', 22, 'spring'], [37, 'June', 1, 'summer'], [40, 'June', 26, 'summer', 5]];
  for (const [week, month, day, season, dow = 1] of checks) {
    const c = at(week, dow);
    assert(c.month === month && c.dayOfMonth === day && c.season === season, `week ${week} day ${dow}: ${c.dayOfMonth} ${c.month}, ${c.season}`);
  }
  // From an absolute week alone (the agenda's date), and the weekend paper's Saturday.
  const c = calendarOf({ absWeek: 53, dayOfWeek: 6 });
  assert(c.year === 2 && c.week === 14 && c.month === 'December' && c.dayOfMonth === 13, `absWeek 53 Saturday: ${c.dayOfMonth} ${c.month}, year ${c.year}`);
  return checks.map(([w]) => `${w}: ${at(w).dayOfMonth} ${at(w).month}`).join(' · ');
});

test('Weather is settled by the seed and the week, fits the season, and never touches the RNG', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p1' });
  const rngBefore = JSON.stringify(s.rng);
  const kinds = {};
  let snowWeeks = 0;
  let janTemp = 0;
  let juneTemp = 0;
  for (let w = 0; w < 160; w++) {
    const a = weatherOf(s, w);
    const b = weatherOf(s, w);
    assert(JSON.stringify(a) === JSON.stringify(b), `week ${w}: not deterministic`);
    assert(data().strings[`weather.${a.kind}`], `week ${w}: no name for ${a.kind}`);
    assert(a.temp > -30 && a.temp < 36, `week ${w}: ${a.temp}°`);
    if (a.season === 'summer') assert(a.kind !== 'snow' && a.kind !== 'storm' && a.snow === 0, `week ${w}: snow in June`);
    if (a.season === 'winter') assert(a.snow === 1 && a.kind !== 'rain', `week ${w}: ${a.kind}, cover ${a.snow} in winter`);
    if (a.kind === 'snow' || a.kind === 'storm') assert(a.snow > 0, `week ${w}: snow falling on bare ground`);
    if (a.falling === 'rain') assert(a.wet === 1, `week ${w}: rain but dry`);
    if (a.month === 'January') janTemp += a.temp;
    if (a.month === 'June') juneTemp += a.temp;
    if (a.snow > 0) snowWeeks++;
    kinds[a.kind] = (kinds[a.kind] || 0) + 1;
  }
  assert(juneTemp > janTemp, 'June is not warmer than January');
  assert(snowWeeks >= 48 && snowWeeks <= 80, `${snowWeeks} weeks with snow on the ground`);
  assert(Object.keys(kinds).length >= 5, `only ${Object.keys(kinds).join(', ')}`);
  const other = newGame({ seed: 'TEST-2', party: 'p1' });
  assert([0, 1, 2, 3, 4, 5].some((w) => weatherOf(other, w).kind !== weatherOf(s, w).kind), 'two seeds have the same weather');
  assert(JSON.stringify(s.rng) === rngBefore, 'the weather moved the RNG');
  return Object.entries(kinds).map(([k, n]) => `${k} ${n}`).join(', ') + ` · ${snowWeeks} snow weeks`;
});

test('The first Monday of winter logs the turn of the season once, and the first week of all logs none', () => {
  const s = newGame({ seed: 'TEST-1', party: 'p1' });
  const turns = Object.values(data().seasons.turns).flat();
  const turned = () => s.log.filter((l) => turns.includes(l.text));
  const winterStart = tuning().calendar.seasons.winter;
  for (let i = 0; i < 2000 && s.date.week < winterStart + 1; i++) {
    const p = pacing.skip(s);
    if (p?.kind === 'dissolved') throw new Error('dissolved');
    pacing.resolve(s, p?.kind === 'division' ? 'line' : null);
  }
  assert(s.date.week >= winterStart + 1, `only reached week ${s.date.week}`);
  const lines = turned();
  assert(lines.length === 1 && data().seasons.turns.winter.includes(lines[0].text), `${lines.length} season lines: ${lines.map((l) => l.text).join(' | ')}`);
  assert(lines[0].week === winterStart - 1, `logged in week ${lines[0].week + 1}, not ${winterStart}`);
  return lines[0].text;
});

test('Election night is settled by the seed: the count ends on your margin, the House fills to its real seats, no line repeats', () => {
  let flips = 0;
  let closeSeats = 0;
  for (let k = 0; k < 24; k++) {
    const s = newGame({ seed: `NIGHT-${k}`, guided: true });
    const rngBefore = JSON.stringify(s.rng);
    const a = coldOpen.electionNight(s);
    const b = coldOpen.electionNight(s);
    assert(JSON.stringify(a) === JSON.stringify(b), `${k}: not deterministic`);
    assert(JSON.stringify(s.rng) === rngBefore, `${k}: the night moved the game's RNG`);
    const last = a.steps[a.steps.length - 1];
    assert(last.votes[0] === a.candidates[0].votes && last.leader === 0, `${k}: the count doesn't end on your total, or you lost`);
    assert(a.margin > 0 && a.margin === a.candidates[0].votes - Math.max(...a.candidates.slice(1).map((c) => c.votes)), `${k}: margin ${a.margin}`);
    const houses = {};
    for (const m of Object.values(s.mps)) houses[m.party] = (houses[m.party] || 0) + 1;
    assert(JSON.stringify(last.seats) === JSON.stringify(houses), `${k}: the seats don't end on the House`);
    for (let i = 1; i < a.steps.length; i++) assert(a.steps[i].polls >= a.steps[i - 1].polls, `${k}: polls went backwards`);
    const call = a.steps.findIndex((x) => x.called);
    assert(call > 0 && a.steps[call].line.includes(data().coldOpen.broadcaster), `${k}: the country is never called`);
    const lines = a.steps.map((x) => x.line);
    assert(new Set(lines).size === lines.length, `${k}: a line repeats`);
    assert(!lines.concat(a.declaration).some((l) => /\{\w+\}/.test(l)), `${k}: a placeholder is left`);
    if (a.close) {
      closeSeats++;
      assert(a.steps[0].leader !== 0, `${k}: a close seat opens with you ahead`);
      flips += a.steps.some((x, i) => i > 0 && x.leader === 0 && a.steps[i - 1].leader !== 0) ? 1 : 0;
    }
  }
  assert(closeSeats > 0 && flips === closeSeats, `${closeSeats} close seats, ${flips} turned`);
  return `${closeSeats} close seats of 24, every one turned`;
});

test('A new career opens on election night, walks into the chamber, then the first Monday; skipping goes straight to Monday', () => {
  const plain = newGame({ seed: 'TEST-1', guided: true });
  const s = newGame({ seed: 'TEST-1', guided: true, coldOpen: true });
  assert(plain.flow.pending?.kind !== 'coldOpen', 'a game without the cold open has one');
  assert(JSON.stringify(plain.rng) === JSON.stringify(s.rng), 'the cold open moved the RNG');

  assert(s.flow.pending?.kind === 'coldOpen' && s.flow.pending.phase === 'count' && s.flow.pending.needsChoice, 'no count first');
  pacing.resolve(s, 'walk');
  pacing.advance(s);

  const me = s.mps[s.player.mpId];

  assert(s.log.some((l) => l.kind === 'career' && l.text.startsWith('Election night in')), 'election night is not on the record');
  pacing.resolve(s);

  assert(s.flow.pending?.kind === 'morning' && s.date.absWeek === 0 && s.date.dayOfWeek === 1, `then ${s.flow.pending?.kind} on day ${s.date.dayOfWeek}`);
